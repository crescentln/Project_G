name: Repository Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Enforce public README privacy boundary
        run: |
          set -euo pipefail
          test -f README.md
          test ! -s README.md
          test "$(git hash-object README.md)" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"

      - name: Reject pull-request edits to generated dist
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          changed_dist="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- ruleset/dist)"
          if [ -n "$changed_dist" ]; then
            echo "Generated ruleset/dist changes must come from Ruleset Promotion."
            echo "$changed_dist"
            exit 1
          fi
