name: Ruleset Promotion

on:
  workflow_run:
    workflows:
      - Source Discovery
    types:
      - completed
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful Source Discovery run ID containing the exact candidate"
        required: true
        type: string
      candidate_artifact_name:
        description: "Optional exact ruleset-candidate-* artifact name"
        required: false
        type: string

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: ruleset-promotion-main
  cancel-in-progress: false
  queue: max

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      should_publish: ${{ steps.final_selection.outputs.should_publish }}
      promotion_kind: ${{ steps.final_selection.outputs.promotion_kind }}
      candidate_run_id: ${{ steps.final_selection.outputs.candidate_run_id }}
      candidate_artifact_name: ${{ steps.final_selection.outputs.candidate_artifact_name }}
      candidate_head_sha: ${{ steps.final_selection.outputs.candidate_head_sha }}
      candidate_decision_fingerprint: ${{ steps.final_selection.outputs.candidate_decision_fingerprint }}
      previous_run_id: ${{ steps.final_selection.outputs.previous_run_id }}
      previous_artifact_name: ${{ steps.final_selection.outputs.previous_artifact_name }}
      promotion_mode: ${{ steps.final_selection.outputs.promotion_mode }}
      environment_name: ${{ steps.final_selection.outputs.environment_name }}
    steps:
      - name: Checkout current main selector
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Setup Python for composite selection
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Select a stable upstream isolation composite
        id: composite_select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          echo "handled=false" >> "$GITHUB_OUTPUT"
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
          echo "require_fallback_marker=false" >> "$GITHUB_OUTPUT"

          readme_size="$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')"
          readme_blob="$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')"
          test "$readme_size" = "0"
          test "$readme_blob" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          runs_json="$(
            gh api \
              "repos/${REPOSITORY}/actions/workflows/source-discovery.yml/runs?branch=main&per_page=100"
          )"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            conclusion="$(jq -r '.workflow_run.conclusion' "$GITHUB_EVENT_PATH")"
            head_branch="$(jq -r '.workflow_run.head_branch' "$GITHUB_EVENT_PATH")"
            if [ "$conclusion" != "success" ] || [ "$head_branch" != "main" ]; then
              echo "Discovery was not a successful main run; no promotion."
              echo "handled=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            run_id="$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")"
          else
            run_id="${INPUT_RUN_ID//[[:space:]]/}"
            if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
              echo "candidate_run_id must be numeric."
              exit 1
            fi
          fi
          run_json="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}")"
          test "$(jq -r '.status' <<<"$run_json")" = "completed"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -r '.head_branch' <<<"$run_json")" = "main"
          test "$(jq -r '.head_repository.full_name' <<<"$run_json")" = "$REPOSITORY"
          test "$(jq -r '.path' <<<"$run_json")" = ".github/workflows/source-discovery.yml"
          run_event="$(jq -r '.event' <<<"$run_json")"
          case "$run_event" in
            push|schedule|workflow_dispatch) ;;
            *) echo "Composite run has an unexpected event: $run_event"; exit 1 ;;
          esac
          source_sha="$(jq -r '.head_sha' <<<"$run_json")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          latest_run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$runs_json")"
          latest_status="$(jq -r '.workflow_runs[0].status // empty' <<<"$runs_json")"
          latest_conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$runs_json")"
          if [ "$latest_run_id" != "$run_id" ]; then
            if [ "$EVENT_NAME" = "workflow_run" ]; then
              echo "A newer Source Discovery superseded this composite; no publication."
              echo "handled=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Manually selected discovery is not the latest run."
            exit 1
          fi
          test "$latest_status" = "completed"
          test "$latest_conclusion" = "success"
          current_main_sha="$(gh api "repos/${REPOSITORY}/commits/main" --jq '.sha')"
          test "$source_sha" = "$current_main_sha"
          test "$(git rev-parse HEAD)" = "$current_main_sha"
          created_epoch="$(date -u -d "$(jq -r '.created_at' <<<"$run_json")" +%s)"
          now_epoch="$(date -u +%s)"
          if [ $((now_epoch - created_epoch)) -gt 93600 ]; then
            echo "Composite discovery is older than the 26-hour freshness SLO."
            exit 1
          fi

          artifacts="$(
            gh api "repos/${REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100"
          )"
          composite_count="$(jq '[.artifacts[] | select(.expired == false) | select(.name | test("^ruleset-isolation-composite-v2-[0-9a-f]{40}-[0-9a-f]{64}-[0-9a-f]{64}$"))] | length' <<<"$artifacts")"
          if [ "$composite_count" -eq 0 ]; then
            workflow_payload="$(
              gh api "repos/${REPOSITORY}/contents/.github/workflows/source-discovery.yml?ref=${source_sha}" --jq '.content' \
                | tr -d '\n' | base64 -d
            )"
            if grep -Fq 'full-candidate-fallback' <<<"$workflow_payload"; then
              echo "Current producer emitted no composite v2; requiring its explicit healthy full-candidate fallback marker."
              echo "require_fallback_marker=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Legacy producer has no composite v2; candidate compatibility remains available."
            exit 0
          fi
          if [ "$composite_count" -ne 1 ]; then
            echo "Current discovery must contain exactly one composite v2 artifact."
            exit 1
          fi
          echo "handled=true" >> "$GITHUB_OUTPUT"

          previous_run_json="$(jq -c '.workflow_runs[1] // empty' <<<"$runs_json")"
          if [ -z "$previous_run_json" ]; then
            echo "Composite has no adjacent prior cycle; stability is not established."
            exit 0
          fi
          previous_run_id="$(jq -r '.id' <<<"$previous_run_json")"
          previous_started="$(date -u -d "$(jq -r '.run_started_at' <<<"$previous_run_json")" +%s)"
          current_started="$(date -u -d "$(jq -r '.run_started_at' <<<"$run_json")" +%s)"
          if [ "$(jq -r '.status' <<<"$previous_run_json")" != "completed" ] || \
             [ "$(jq -r '.conclusion' <<<"$previous_run_json")" != "success" ] || \
             [ "$(jq -r '.head_sha' <<<"$previous_run_json")" != "$source_sha" ] || \
             [ "$(jq -r '.head_repository.full_name' <<<"$previous_run_json")" != "$REPOSITORY" ] || \
             [ "$(jq -r '.path' <<<"$previous_run_json")" != ".github/workflows/source-discovery.yml" ] || \
             [ $((current_started - previous_started)) -lt 300 ]; then
            echo "Adjacent discovery is not a same-source success at least 300 seconds earlier; stability reset."
            exit 0
          fi
          previous_event="$(jq -r '.event' <<<"$previous_run_json")"
          case "$previous_event" in
            push|schedule|workflow_dispatch) ;;
            *) echo "Adjacent discovery event is not eligible; stability reset."; exit 0 ;;
          esac
          previous_artifacts="$(
            gh api "repos/${REPOSITORY}/actions/runs/${previous_run_id}/artifacts?per_page=100"
          )"
          previous_count="$(jq '[.artifacts[] | select(.expired == false) | select(.name | test("^ruleset-isolation-composite-v2-[0-9a-f]{40}-[0-9a-f]{64}-[0-9a-f]{64}$"))] | length' <<<"$previous_artifacts")"
          if [ "$previous_count" -ne 1 ]; then
            echo "Adjacent discovery has no unique composite v2 artifact; stability reset."
            exit 0
          fi

          selection_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/project-g-composite-select.XXXXXX")"
          mkdir -p "$selection_dir/current" "$selection_dir/previous"
          python3 ruleset/scripts/collect_upstream_composite_cycle.py \
            --repository "$REPOSITORY" \
            --run-id "$run_id" \
            --expected-main-sha "$source_sha" \
            --output-dir "$selection_dir/current"
          python3 ruleset/scripts/collect_upstream_composite_cycle.py \
            --repository "$REPOSITORY" \
            --run-id "$previous_run_id" \
            --expected-main-sha "$source_sha" \
            --output-dir "$selection_dir/previous"
          python3 ruleset/scripts/verify_upstream_composite.py \
            --current-cycle-dir "$selection_dir/current" \
            --previous-cycle-dir "$selection_dir/previous" \
            --expected-main-sha "$source_sha" \
            --repository "$REPOSITORY" \
            --output "$selection_dir/pair-receipt.json"
          decision="$(jq -r '.decision' "$selection_dir/pair-receipt.json")"
          if [ "$decision" = "NOOP_NOT_ELIGIBLE" ]; then
            echo "Stable isolated composite is a semantic no-op; no publication."
            exit 0
          fi
          test "$decision" = "REQUIRES_PROMOTION_AUTHORIZATION"
          current_name="$(jq -r '.current.artifact_name' "$selection_dir/pair-receipt.json")"
          previous_name="$(jq -r '.previous.artifact_name' "$selection_dir/pair-receipt.json")"
          pair_fingerprint="$(jq -r '.receipt_sha256' "$selection_dir/pair-receipt.json")"
          [[ "$pair_fingerprint" =~ ^[0-9a-f]{64}$ ]]
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "candidate_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "candidate_artifact_name=$current_name" >> "$GITHUB_OUTPUT"
          echo "candidate_head_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_decision_fingerprint=$pair_fingerprint" >> "$GITHUB_OUTPUT"
          echo "previous_run_id=$previous_run_id" >> "$GITHUB_OUTPUT"
          echo "previous_artifact_name=$previous_name" >> "$GITHUB_OUTPUT"
          echo "promotion_mode=isolated-composite" >> "$GITHUB_OUTPUT"
          echo "environment_name=ruleset-production" >> "$GITHUB_OUTPUT"

      - name: Select an automatically reviewed stable candidate
        id: select
        if: steps.composite_select.outputs.handled != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.candidate_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          REQUIRE_FALLBACK_MARKER: ${{ steps.composite_select.outputs.require_fallback_marker }}
        run: |
          set -euo pipefail
          echo "should_publish=false" >> "$GITHUB_OUTPUT"

          readme_size="$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')"
          readme_blob="$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')"
          test "$readme_size" = "0"
          test "$readme_blob" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"

          runs_json="$(
            gh api \
              "repos/${REPOSITORY}/actions/workflows/source-discovery.yml/runs?branch=main&per_page=100"
          )"

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            conclusion="$(jq -r '.workflow_run.conclusion' "$GITHUB_EVENT_PATH")"
            head_branch="$(jq -r '.workflow_run.head_branch' "$GITHUB_EVENT_PATH")"
            if [ "$conclusion" != "success" ] || [ "$head_branch" != "main" ]; then
              echo "Discovery was not a successful main run; no promotion."
              exit 0
            fi
            run_id="$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")"
          else
            run_id="${INPUT_RUN_ID//[[:space:]]/}"
            if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
              echo "candidate_run_id must be numeric."
              exit 1
            fi
          fi

          run_json="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}")"
          artifact_json="$(
            gh api "repos/${REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100"
          )"
          candidate_objects="$(
            jq -c '
              [.artifacts[]
                | select(.expired == false)
                | select(
                    .name
                    | test(
                        "^ruleset-candidate-(low|high)-[0-9a-f]{64}-[0-9a-f]{64}-[0-9a-f]{64}$"
                      )
                  )
                | {id, name}]
            ' <<<"$artifact_json"
          )"
          candidate_count="$(jq 'length' <<<"$candidate_objects")"
          if [ "$candidate_count" -eq 0 ] && [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "Discovery produced no changed candidate eligible for automated review."
            exit 0
          fi
          if [ "$candidate_count" -ne 1 ]; then
            echo "Discovery run must contain exactly one automatically reviewable candidate."
            exit 1
          fi
          unique_candidate_name="$(jq -r '.[0].name' <<<"$candidate_objects")"
          artifact_name="${INPUT_ARTIFACT_NAME//[[:space:]]/}"
          if [ -z "$artifact_name" ]; then
            artifact_name="$unique_candidate_name"
          elif [ "$artifact_name" != "$unique_candidate_name" ]; then
            echo "Requested artifact is not the run's unique candidate."
            exit 1
          fi
          artifact_id="$(
            jq -r --arg name "$artifact_name" \
              '.[] | select(.name == $name) | .id' <<<"$candidate_objects"
          )"
          if ! [[ "$artifact_id" =~ ^[0-9]+$ ]]; then
            echo "Candidate artifact has an invalid ID."
            exit 1
          fi

          test "$(jq -r '.status' <<<"$run_json")" = "completed"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -r '.head_branch' <<<"$run_json")" = "main"
          test "$(jq -r '.head_repository.full_name' <<<"$run_json")" = "$REPOSITORY"
          test "$(jq -r '.path' <<<"$run_json")" = ".github/workflows/source-discovery.yml"
          run_event="$(jq -r '.event' <<<"$run_json")"
          case "$run_event" in
            push|schedule|workflow_dispatch) ;;
            *) echo "Candidate run has an unexpected event: $run_event"; exit 1 ;;
          esac
          candidate_head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          if ! [[ "$candidate_head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Candidate run has an invalid head SHA."
            exit 1
          fi
          created_epoch="$(date -u -d "$(jq -r '.created_at' <<<"$run_json")" +%s)"
          now_epoch="$(date -u +%s)"
          if [ $((now_epoch - created_epoch)) -gt 93600 ]; then
            echo "Candidate discovery is older than the 26-hour freshness SLO."
            exit 1
          fi
          latest_run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$runs_json")"
          latest_status="$(jq -r '.workflow_runs[0].status // empty' <<<"$runs_json")"
          latest_conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$runs_json")"
          if [ "$latest_run_id" != "$run_id" ]; then
            if [ "$EVENT_NAME" = "workflow_run" ]; then
              echo "A newer Source Discovery superseded this queued promotion; no publication."
              exit 0
            fi
            echo "Manually selected candidate is not the latest Source Discovery run."
            exit 1
          fi
          if [ "$latest_status" != "completed" ] || \
             [ "$latest_conclusion" != "success" ]; then
            echo "Latest Source Discovery is not a completed success."
            exit 1
          fi
          current_main_sha="$(gh api "repos/${REPOSITORY}/commits/main" --jq '.sha')"
          if [ "$current_main_sha" != "$candidate_head_sha" ]; then
            echo "Candidate source does not match current main."
            exit 1
          fi

          candidate_pattern='^ruleset-candidate-(low|high)-([0-9a-f]{64})-([0-9a-f]{64})-([0-9a-f]{64})$'
          if ! [[ "$artifact_name" =~ $candidate_pattern ]]; then
            echo "Candidate artifact name is invalid: $artifact_name"
            exit 1
          fi
          artifact_risk="${BASH_REMATCH[1]}"
          candidate_decision_fingerprint="${BASH_REMATCH[3]}"
          artifact_count="$(
            jq -r --arg name "$artifact_name" \
              '[.artifacts[] | select(.expired == false and .name == $name)] | length' \
              <<<"$artifact_json"
          )"
          if [ "$artifact_count" != "1" ]; then
            echo "Exact candidate artifact was not found once in discovery run ${run_id}."
            exit 1
          fi

          case "$artifact_risk" in
            low)
              promotion_mode="auto-low-risk"
              environment_name="ruleset-low-risk"
              ;;
            high)
              promotion_mode="auto-high-risk"
              environment_name="ruleset-production"
              ;;
            *)
              echo "Candidate risk is not automatically reviewable."
              exit 1
              ;;
          esac

          selection_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/project-g-selection.XXXXXX")"
          candidate_archive="${selection_dir}/candidate.zip"
          current_review="${selection_dir}/current-automated-review.json"
          gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "$candidate_archive"
          if [ "${REQUIRE_FALLBACK_MARKER:-false}" = "true" ]; then
            marker="$(
              unzip -p "$candidate_archive" composite-mode.txt \
                | tr -d '[:space:]'
            )"
            if [ "$marker" != "full-candidate-fallback" ]; then
              echo "Current producer omitted composite v2 without the explicit healthy full-candidate fallback marker."
              exit 1
            fi
          fi
          if ! unzip -p "$candidate_archive" automated-review.json \
            > "$current_review"; then
            echo "Candidate lacks automated review evidence."
            exit 1
          fi
          for name in \
            candidate-identity.json \
            candidate-decision.json \
            source-sha.txt \
            ruleset-dist.tar.gz; do
            if ! unzip -p "$candidate_archive" "$name" \
              > "${selection_dir}/current-${name}"; then
              echo "Candidate lacks exact identity or attested archive evidence: ${name}."
              exit 1
            fi
          done
          if [ "$(tr -d '[:space:]' < "${selection_dir}/current-source-sha.txt")" != \
            "$candidate_head_sha" ]; then
            echo "Candidate source identity does not match its discovery run."
            exit 1
          fi
          gh attestation verify "${selection_dir}/current-ruleset-dist.tar.gz" \
            --repo "$REPOSITORY" \
            --signer-workflow "${REPOSITORY}/.github/workflows/source-discovery.yml" \
            --signer-digest "$candidate_head_sha" \
            --source-digest "$candidate_head_sha" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          if ! jq -e \
            --arg risk "$artifact_risk" \
            '
              .schema == "project-g-automated-review-v2"
              and (.eligible | type == "boolean")
              and .required_stable_cycles == 2
              and .review_policy == "unattended-evidence-gated-v2"
              and .minimum_cycle_separation_seconds == 300
              and .risk_level == $risk
              and (.blockers | type == "array")
            ' "$current_review" >/dev/null; then
            echo "Candidate automated review evidence is malformed."
            exit 1
          fi
          if ! jq -e '.eligible == true and (.blockers | length) == 0' \
            "$current_review" >/dev/null; then
            echo "Candidate is held by the automated evidence policy:"
            jq -r '"blocker_count=" + ((.blockers | length) | tostring), (.blockers[0:50][] | "- " + .)' \
              "$current_review"
            exit 0
          fi
          current_fingerprint="$(
            unzip -p "$candidate_archive" decision-fingerprint.txt \
              | tr -d '[:space:]'
          )"
          if [ "$current_fingerprint" != "$candidate_decision_fingerprint" ]; then
            echo "Candidate decision evidence does not match its artifact name."
            exit 1
          fi

          previous_run_json="$(jq -c '.workflow_runs[1] // empty' <<<"$runs_json")"
          if [ -z "$previous_run_json" ]; then
            echo "Candidate has no adjacent prior discovery cycle; stability is not established."
            exit 0
          fi
          previous_run_id="$(jq -r '.id' <<<"$previous_run_json")"
          previous_status="$(jq -r '.status' <<<"$previous_run_json")"
          previous_conclusion="$(jq -r '.conclusion' <<<"$previous_run_json")"
          previous_path="$(jq -r '.path' <<<"$previous_run_json")"
          previous_repository="$(jq -r '.head_repository.full_name' <<<"$previous_run_json")"
          previous_head_sha="$(jq -r '.head_sha' <<<"$previous_run_json")"
          previous_event="$(jq -r '.event' <<<"$previous_run_json")"
          previous_created_epoch="$(date -u -d "$(jq -r '.created_at' <<<"$previous_run_json")" +%s)"
          if [ "$previous_status" != "completed" ] || \
             [ "$previous_conclusion" != "success" ] || \
             [ "$previous_path" != ".github/workflows/source-discovery.yml" ] || \
             [ "$previous_repository" != "$REPOSITORY" ] || \
             [ "$previous_head_sha" != "$candidate_head_sha" ]; then
            echo "The adjacent prior discovery was not a successful same-source run; stability reset."
            exit 0
          fi
          case "$previous_event" in
            push|schedule|workflow_dispatch) ;;
            *) echo "The adjacent prior discovery had an unexpected event."; exit 0 ;;
          esac
          cycle_separation=$((created_epoch - previous_created_epoch))
          if [ "$cycle_separation" -lt 300 ]; then
            echo "Adjacent discovery cycles are less than 300 seconds apart; stability reset."
            exit 0
          fi
          previous_artifacts="$(
            gh api \
              "repos/${REPOSITORY}/actions/runs/${previous_run_id}/artifacts?per_page=100"
          )"
          previous_candidates="$(
            jq -c '
              [.artifacts[]
                | select(.expired == false)
                | select(
                    .name
                    | test(
                        "^ruleset-candidate-(low|high)-[0-9a-f]{64}-[0-9a-f]{64}-[0-9a-f]{64}$"
                      )
                  )
                | {id, name}]
            ' <<<"$previous_artifacts"
          )"
          previous_name="$(jq -r '.[0].name // empty' <<<"$previous_candidates")"
          if [ "$(jq 'length' <<<"$previous_candidates")" -ne 1 ] || \
             ! [[ "$previous_name" =~ $candidate_pattern ]]; then
            echo "The adjacent prior discovery has no unique automated decision."
            exit 0
          fi
          previous_risk="${BASH_REMATCH[1]}"
          previous_decision_fingerprint="${BASH_REMATCH[3]}"
          if [ "$previous_name" != "$artifact_name" ] || \
             [ "$previous_risk" != "$artifact_risk" ] || \
             [ "$previous_decision_fingerprint" != "$candidate_decision_fingerprint" ]; then
            echo "Candidate decision and full identity were not stable across adjacent cycles."
            exit 0
          fi
          previous_artifact_id="$(jq -r '.[0].id' <<<"$previous_candidates")"
          if ! [[ "$previous_artifact_id" =~ ^[0-9]+$ ]]; then
            echo "The adjacent prior discovery has an invalid artifact ID."
            exit 1
          fi
          previous_archive="${selection_dir}/previous.zip"
          previous_review="${selection_dir}/previous-automated-review.json"
          gh api \
            "repos/${REPOSITORY}/actions/artifacts/${previous_artifact_id}/zip" \
            > "$previous_archive"
          if ! unzip -p "$previous_archive" automated-review.json \
            > "$previous_review"; then
            echo "The adjacent prior discovery lacks automated review evidence."
            exit 1
          fi
          for name in \
            candidate-identity.json \
            candidate-decision.json \
            source-sha.txt \
            ruleset-dist.tar.gz; do
            if ! unzip -p "$previous_archive" "$name" \
              > "${selection_dir}/previous-${name}"; then
              echo "The adjacent prior discovery lacks exact identity or attested archive evidence: ${name}."
              exit 1
            fi
          done
          if [ "$(tr -d '[:space:]' < "${selection_dir}/previous-source-sha.txt")" != \
            "$candidate_head_sha" ] || \
             ! cmp "${selection_dir}/current-candidate-identity.json" \
               "${selection_dir}/previous-candidate-identity.json" || \
             ! cmp "${selection_dir}/current-candidate-decision.json" \
               "${selection_dir}/previous-candidate-decision.json"; then
            echo "Exact candidate identity was not identical across adjacent cycles."
            exit 0
          fi
          gh attestation verify "${selection_dir}/previous-ruleset-dist.tar.gz" \
            --repo "$REPOSITORY" \
            --signer-workflow "${REPOSITORY}/.github/workflows/source-discovery.yml" \
            --signer-digest "$candidate_head_sha" \
            --source-digest "$candidate_head_sha" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          if ! cmp "$current_review" "$previous_review" || \
             ! jq -e '.eligible == true and (.blockers | length) == 0' \
               "$previous_review" >/dev/null; then
            echo "Automated rule-level evidence was not identical across adjacent cycles."
            exit 0
          fi
          previous_fingerprint="$(
            unzip -p "$previous_archive" decision-fingerprint.txt \
              | tr -d '[:space:]'
          )"
          if [ "$previous_fingerprint" != "$candidate_decision_fingerprint" ]; then
            echo "The adjacent prior decision evidence does not match its artifact name."
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "candidate_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "candidate_artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "candidate_head_sha=$candidate_head_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_decision_fingerprint=$candidate_decision_fingerprint" >> "$GITHUB_OUTPUT"
          echo "promotion_mode=$promotion_mode" >> "$GITHUB_OUTPUT"
          echo "environment_name=$environment_name" >> "$GITHUB_OUTPUT"

      - name: Freeze selected promotion kind
        id: final_selection
        if: ${{ !cancelled() }}
        env:
          COMPOSITE_HANDLED: ${{ steps.composite_select.outputs.handled }}
          COMPOSITE_SHOULD_PUBLISH: ${{ steps.composite_select.outputs.should_publish }}
          COMPOSITE_RUN_ID: ${{ steps.composite_select.outputs.candidate_run_id }}
          COMPOSITE_ARTIFACT_NAME: ${{ steps.composite_select.outputs.candidate_artifact_name }}
          COMPOSITE_HEAD_SHA: ${{ steps.composite_select.outputs.candidate_head_sha }}
          COMPOSITE_FINGERPRINT: ${{ steps.composite_select.outputs.candidate_decision_fingerprint }}
          COMPOSITE_PREVIOUS_RUN_ID: ${{ steps.composite_select.outputs.previous_run_id }}
          COMPOSITE_PREVIOUS_ARTIFACT_NAME: ${{ steps.composite_select.outputs.previous_artifact_name }}
          COMPOSITE_MODE: ${{ steps.composite_select.outputs.promotion_mode }}
          COMPOSITE_ENVIRONMENT: ${{ steps.composite_select.outputs.environment_name }}
          CANDIDATE_SHOULD_PUBLISH: ${{ steps.select.outputs.should_publish }}
          CANDIDATE_RUN_ID: ${{ steps.select.outputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.select.outputs.candidate_artifact_name }}
          CANDIDATE_HEAD_SHA: ${{ steps.select.outputs.candidate_head_sha }}
          CANDIDATE_FINGERPRINT: ${{ steps.select.outputs.candidate_decision_fingerprint }}
          CANDIDATE_MODE: ${{ steps.select.outputs.promotion_mode }}
          CANDIDATE_ENVIRONMENT: ${{ steps.select.outputs.environment_name }}
        run: |
          set -euo pipefail
          if [ "${COMPOSITE_HANDLED:-false}" = "true" ]; then
            echo "promotion_kind=composite" >> "$GITHUB_OUTPUT"
            echo "should_publish=${COMPOSITE_SHOULD_PUBLISH:-false}" >> "$GITHUB_OUTPUT"
            for row in \
              "candidate_run_id:${COMPOSITE_RUN_ID:-}" \
              "candidate_artifact_name:${COMPOSITE_ARTIFACT_NAME:-}" \
              "candidate_head_sha:${COMPOSITE_HEAD_SHA:-}" \
              "candidate_decision_fingerprint:${COMPOSITE_FINGERPRINT:-}" \
              "previous_run_id:${COMPOSITE_PREVIOUS_RUN_ID:-}" \
              "previous_artifact_name:${COMPOSITE_PREVIOUS_ARTIFACT_NAME:-}" \
              "promotion_mode:${COMPOSITE_MODE:-}" \
              "environment_name:${COMPOSITE_ENVIRONMENT:-}"; do
              key="${row%%:*}"
              value="${row#*:}"
              if [ -n "$value" ]; then
                echo "${key}=${value}" >> "$GITHUB_OUTPUT"
              fi
            done
            exit 0
          fi
          echo "promotion_kind=candidate" >> "$GITHUB_OUTPUT"
          echo "should_publish=${CANDIDATE_SHOULD_PUBLISH:-false}" >> "$GITHUB_OUTPUT"
          for row in \
            "candidate_run_id:${CANDIDATE_RUN_ID:-}" \
            "candidate_artifact_name:${CANDIDATE_ARTIFACT_NAME:-}" \
            "candidate_head_sha:${CANDIDATE_HEAD_SHA:-}" \
            "candidate_decision_fingerprint:${CANDIDATE_FINGERPRINT:-}" \
            "promotion_mode:${CANDIDATE_MODE:-}" \
            "environment_name:${CANDIDATE_ENVIRONMENT:-}"; do
            key="${row%%:*}"
            value="${row#*:}"
            if [ -n "$value" ]; then
              echo "${key}=${value}" >> "$GITHUB_OUTPUT"
            fi
          done

  publish:
    if: needs.select.outputs.should_publish == 'true'
    needs:
      - select
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: ruleset-publication-main
      cancel-in-progress: false
      queue: max
    outputs:
      published_sha: ${{ steps.prepare_snapshot.outputs.published_sha }}
      published_semantic_digest: ${{ steps.prepare_snapshot.outputs.semantic_digest }}
    environment:
      name: ${{ needs.select.outputs.environment_name }}
    permissions:
      actions: read
      attestations: read
      contents: write
      statuses: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      PROMOTION_KIND: ${{ needs.select.outputs.promotion_kind }}
      CANDIDATE_RUN_ID: ${{ needs.select.outputs.candidate_run_id }}
      CANDIDATE_ARTIFACT_NAME: ${{ needs.select.outputs.candidate_artifact_name }}
      PREVIOUS_RUN_ID: ${{ needs.select.outputs.previous_run_id }}
      PREVIOUS_ARTIFACT_NAME: ${{ needs.select.outputs.previous_artifact_name }}
      EXPECTED_SOURCE_SHA: ${{ needs.select.outputs.candidate_head_sha }}
      EXPECTED_DECISION_FINGERPRINT: ${{ needs.select.outputs.candidate_decision_fingerprint }}
      PROMOTION_MODE: ${{ needs.select.outputs.promotion_mode }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Download exact candidate
        if: env.PROMOTION_KIND == 'candidate'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.select.outputs.candidate_artifact_name }}
          path: .promotion
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.select.outputs.candidate_run_id }}
          digest-mismatch: error

      - name: Verify candidate identity and source freshness
        if: env.PROMOTION_KIND == 'candidate'
        id: candidate_reservation
        run: |
          set -euo pipefail
          echo "continue=true" >> "$GITHUB_OUTPUT"
          close_as_superseded() {
            reason="$1"
            echo "continue=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Publication reservation closed"
              echo
              echo "$reason"
              echo
              echo "The current automatic chain remains fail-closed; no user action is required."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$reason"
            exit 0
          }
          run_json="$(gh api "repos/${REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          test "$(jq -r '.status' <<<"$run_json")" = "completed"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -r '.head_branch' <<<"$run_json")" = "main"
          test "$(jq -r '.head_repository.full_name' <<<"$run_json")" = "$REPOSITORY"
          test "$(jq -r '.path' <<<"$run_json")" = \
            ".github/workflows/source-discovery.yml"
          candidate_run_head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          test "$candidate_run_head_sha" = "$EXPECTED_SOURCE_SHA"
          created_epoch="$(date -u -d "$(jq -r '.created_at' <<<"$run_json")" +%s)"
          now_epoch="$(date -u +%s)"
          if [ $((now_epoch - created_epoch)) -gt 93600 ]; then
            close_as_superseded \
              "Candidate expired before automatic publication completed."
          fi
          runs_json="$(
            gh api \
              "repos/${REPOSITORY}/actions/workflows/source-discovery.yml/runs?branch=main&per_page=100"
          )"
          newer_runs="$(
            jq -c --argjson selected "$CANDIDATE_RUN_ID" '
              .workflow_runs as $runs
              | ($runs | map(.id) | index($selected)) as $selected_index
              | if $selected_index == null
                then error("reserved candidate is outside the discovery window")
                else $runs[0:$selected_index]
                end
            ' <<<"$runs_json"
          )"
          active_newer_runs="$(
            jq -c '[.[] | select(.status != "completed")]' <<<"$newer_runs"
          )"
          if ! jq -e \
            --arg repository "$REPOSITORY" \
            --arg sha "$EXPECTED_SOURCE_SHA" \
            'all(.[];
              .path == ".github/workflows/source-discovery.yml"
              and .head_repository.full_name == $repository
              and .head_sha == $sha
              and (
                .event == "push"
                or .event == "schedule"
                or .event == "workflow_dispatch"
              )
            )' <<<"$active_newer_runs" >/dev/null; then
            close_as_superseded \
              "A newer active discovery targets different source evidence."
          fi
          active_newer_count="$(jq 'length' <<<"$active_newer_runs")"
          if [ "$active_newer_count" -gt 0 ]; then
            echo "Ignoring ${active_newer_count} newer active discovery run(s) while the exact publication lock is held."
          fi
          newer_runs="$(
            jq -c '[.[] | select(.status == "completed")]' <<<"$newer_runs"
          )"
          if ! jq -e \
            --arg repository "$REPOSITORY" \
            --arg sha "$EXPECTED_SOURCE_SHA" \
            'all(.[];
              .status == "completed"
              and .conclusion == "success"
              and .path == ".github/workflows/source-discovery.yml"
              and .head_repository.full_name == $repository
              and .head_sha == $sha
              and (
                .event == "push"
                or .event == "schedule"
                or .event == "workflow_dispatch"
              )
            )' <<<"$newer_runs" >/dev/null; then
            close_as_superseded \
              "A newer completed discovery failed, was cancelled, or changed source identity."
          fi
          newer_run_count="$(jq 'length' <<<"$newer_runs")"
          if [ "$newer_run_count" -gt 0 ]; then
            echo "${newer_run_count} newer successful discovery run(s) observed; the exact reserved candidate remains selected."
          fi
          newer_evidence_dir="${RUNNER_TEMP}/newer-discovery-evidence"
          mkdir -p "$newer_evidence_dir"
          while IFS= read -r newer_run_id; do
            test -n "$newer_run_id" || continue
            newer_artifacts="$(
              gh api \
                "repos/${REPOSITORY}/actions/runs/${newer_run_id}/artifacts?per_page=100"
            )"
            newer_candidates="$(
              jq -c '
                [.artifacts[]
                  | select(.expired == false)
                  | select(
                      .name
                      | test(
                          "^ruleset-candidate-(low|high)-[0-9a-f]{64}-[0-9a-f]{64}-[0-9a-f]{64}$"
                        )
                    )
                  | {id, name}]
              ' <<<"$newer_artifacts"
            )"
            if [ "$(jq 'length' <<<"$newer_candidates")" -ne 1 ]; then
              close_as_superseded \
                "Newer successful discovery ${newer_run_id} has ambiguous evidence."
            fi
            newer_artifact_id="$(jq -r '.[0].id' <<<"$newer_candidates")"
            newer_artifact_name="$(jq -r '.[0].name' <<<"$newer_candidates")"
            candidate_pattern='^ruleset-candidate-(low|high)-([0-9a-f]{64})-([0-9a-f]{64})-([0-9a-f]{64})$'
            if ! [[ "$newer_artifact_name" =~ $candidate_pattern ]]; then
              close_as_superseded \
                "Newer discovery ${newer_run_id} has an invalid candidate name."
            fi
            newer_decision_fingerprint="${BASH_REMATCH[3]}"
            if [ "$newer_decision_fingerprint" != \
              "$EXPECTED_DECISION_FINGERPRINT" ]; then
              close_as_superseded \
                "Newer discovery ${newer_run_id} changed the automated decision; the reserved candidate is frozen."
            fi
            newer_archive="${newer_evidence_dir}/${newer_artifact_id}.zip"
            gh api \
              "repos/${REPOSITORY}/actions/artifacts/${newer_artifact_id}/zip" \
              > "$newer_archive"
            if ! unzip -p "$newer_archive" candidate-manifest.json | jq -e '
              .source_head_advanced_after_lock == false
              and .fallback_cache_count == 0
              and (.cache_blocked_source_ids | length) == 0
              and (.budget_exceeded | length) == 0
            ' >/dev/null; then
              close_as_superseded \
                "Newer discovery ${newer_run_id} has a source, cache, or budget blocker."
            fi
            if ! unzip -p "$newer_archive" source-health.json | jq -e '
              .status == "healthy"
              and .fallback_cache_count == 0
              and (.cache_blocked_source_ids | length) == 0
            ' >/dev/null; then
              close_as_superseded \
                "Newer discovery ${newer_run_id} has unhealthy source evidence."
            fi
            if ! unzip -p "$newer_archive" source-radar-decision.json | \
              jq -e '.promotion_blocked == false' >/dev/null; then
              close_as_superseded \
                "Newer discovery ${newer_run_id} has an active-source race."
            fi
            if ! unzip -p "$newer_archive" automated-review.json | jq -e \
              '
                .schema == "project-g-automated-review-v2"
                and .eligible == true
                and .required_stable_cycles == 2
                and .review_policy == "unattended-evidence-gated-v2"
                and .minimum_cycle_separation_seconds == 300
                and (.blockers | length) == 0
              ' >/dev/null; then
              close_as_superseded \
                "Newer discovery ${newer_run_id} lacks eligible automated evidence."
            fi
            newer_review="${newer_evidence_dir}/${newer_artifact_id}-automated-review.json"
            unzip -p "$newer_archive" automated-review.json > "$newer_review"
            if ! cmp .promotion/automated-review.json "$newer_review"; then
              close_as_superseded \
                "Newer discovery ${newer_run_id} changed rule-level evidence."
            fi
            newer_fingerprint="$(
              unzip -p "$newer_archive" decision-fingerprint.txt \
                | tr -d '[:space:]'
            )"
            if [ "$newer_fingerprint" != "$EXPECTED_DECISION_FINGERPRINT" ]; then
              close_as_superseded \
                "Newer discovery ${newer_run_id} decision evidence is inconsistent."
            fi
            echo "Validated newer discovery ${newer_run_id}: ${newer_artifact_name}"
          done < <(jq -r '.[].id' <<<"$newer_runs")
          (
            cd .promotion
            sha256sum -c ruleset-dist.sha256
          )
          candidate_source_sha="$(tr -d '[:space:]' < .promotion/source-sha.txt)"
          candidate_digest="$(tr -d '[:space:]' < .promotion/semantic-digest.txt)"
          candidate_decision_fingerprint="$(
            tr -d '[:space:]' < .promotion/decision-fingerprint.txt
          )"
          candidate_identity_digest="$(tr -d '[:space:]' < .promotion/identity-digest.txt)"
          manifest_digest="$(jq -r '.semantic_digest' .promotion/candidate-manifest.json)"
          manifest_risk="$(jq -r '.risk_level' .promotion/candidate-manifest.json)"
          decision_file_digest="$(sha256sum .promotion/candidate-decision.json | awk '{print $1}')"
          identity_file_digest="$(sha256sum .promotion/candidate-identity.json | awk '{print $1}')"
          candidate_pattern='^ruleset-candidate-(low|high)-([0-9a-f]{64})-([0-9a-f]{64})-([0-9a-f]{64})$'
          if ! [[ "$CANDIDATE_ARTIFACT_NAME" =~ $candidate_pattern ]]; then
            echo "Candidate artifact name is invalid."
            exit 1
          fi
          artifact_risk="${BASH_REMATCH[1]}"
          artifact_semantic_digest="${BASH_REMATCH[2]}"
          artifact_decision_fingerprint="${BASH_REMATCH[3]}"
          artifact_identity_digest="${BASH_REMATCH[4]}"
          test "$candidate_digest" = "$manifest_digest"
          test "$candidate_digest" = "$artifact_semantic_digest"
          test "$candidate_decision_fingerprint" = "$decision_file_digest"
          test "$candidate_decision_fingerprint" = "$artifact_decision_fingerprint"
          test "$candidate_decision_fingerprint" = "$EXPECTED_DECISION_FINGERPRINT"
          test "$candidate_identity_digest" = "$identity_file_digest"
          test "$candidate_identity_digest" = "$artifact_identity_digest"
          test "$manifest_risk" = "$artifact_risk"
          test "$(jq -r '.schema' .promotion/automated-review.json)" = \
            "project-g-automated-review-v2"
          test "$(jq -r '.eligible' .promotion/automated-review.json)" = "true"
          test "$(jq -r '.required_stable_cycles' .promotion/automated-review.json)" = "2"
          test "$(jq -r '.review_policy' .promotion/automated-review.json)" = \
            "unattended-evidence-gated-v2"
          test "$(jq -r '.minimum_cycle_separation_seconds' .promotion/automated-review.json)" = "300"
          test "$(jq -r '.risk_level' .promotion/automated-review.json)" = \
            "$manifest_risk"
          test "$(jq '.blockers | length' .promotion/automated-review.json)" = "0"
          test "$(jq -r '.semantic_digest' .promotion/candidate-identity.json)" = "$candidate_digest"
          test "$(jq -r '.decision_fingerprint' .promotion/candidate-identity.json)" = \
            "$candidate_decision_fingerprint"
          test "$(jq -r '.decision_schema' .promotion/candidate-identity.json)" = \
            "project-g-candidate-decision-v1"
          test "$(jq -r '.source_sha' .promotion/candidate-identity.json)" = "$candidate_source_sha"
          test "$(jq -r '.source_lock_sha256' .promotion/candidate-identity.json)" = \
            "$(jq -r '.source_lock_sha256' .promotion/candidate-manifest.json)"
          test "$(jq -r '.workflow_sha256' .promotion/candidate-identity.json)" = \
            "$(sha256sum .github/workflows/source-discovery.yml | awk '{print $1}')"
          test "$candidate_source_sha" = "$EXPECTED_SOURCE_SHA"

          recomputed_dir="${RUNNER_TEMP}/candidate-identity"
          mkdir -p "$recomputed_dir"
          python3 ruleset/scripts/build_candidate_identity.py \
            --manifest .promotion/candidate-manifest.json \
            --radar-decision .promotion/source-radar-decision.json \
            --automated-review .promotion/automated-review.json \
            --source-sha "$candidate_source_sha" \
            --workflow .github/workflows/source-discovery.yml \
            --identity-output "$recomputed_dir/candidate-identity.json" \
            --decision-output "$recomputed_dir/candidate-decision.json" \
            --fingerprint-output "$recomputed_dir/decision-fingerprint.txt"
          cmp .promotion/candidate-identity.json \
            "$recomputed_dir/candidate-identity.json"
          cmp .promotion/candidate-decision.json \
            "$recomputed_dir/candidate-decision.json"
          cmp .promotion/decision-fingerprint.txt \
            "$recomputed_dir/decision-fingerprint.txt"

          test "$(jq -r '.source_head_advanced_after_lock' .promotion/candidate-manifest.json)" = "false"
          test "$(jq '.budget_exceeded | length' .promotion/candidate-manifest.json)" = "0"
          test "$(jq -r '.fallback_cache_count' .promotion/candidate-manifest.json)" = "0"
          test "$(jq '.cache_blocked_source_ids | length' .promotion/candidate-manifest.json)" = "0"
          test "$(jq -r '.status' .promotion/source-health.json)" = "healthy"
          test "$(jq -r '.fallback_cache_count' .promotion/source-health.json)" = "0"
          test "$(jq '.cache_blocked_source_ids | length' .promotion/source-health.json)" = "0"
          test "$(jq -r '.promotion_blocked' .promotion/source-radar-decision.json)" = "false"

          git fetch --no-tags origin main
          remote_sha="$(git rev-parse origin/main)"
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$candidate_source_sha" != "$remote_sha" ] || [ "$checkout_sha" != "$remote_sha" ]; then
            close_as_superseded \
              "Source moved after candidate validation; the newer main chain owns publication."
          fi
          case "$PROMOTION_MODE:$manifest_risk" in
            auto-low-risk:low)
              test "$(jq -r '.auto_promotion_eligible' \
                .promotion/candidate-manifest.json)" = "true"
              ;;
            auto-high-risk:high) ;;
            *) echo "Promotion mode does not match candidate risk."; exit 1 ;;
          esac
          test "$(jq -r '.changed' .promotion/candidate-manifest.json)" = "true"

      - name: Reverify and authorize exact isolated composite
        if: env.PROMOTION_KIND == 'composite'
        id: composite_reservation
        run: |
          set -euo pipefail
          echo "continue=false" >> "$GITHUB_OUTPUT"
          close_as_superseded() {
            reason="$1"
            {
              echo "## Isolated publication reservation closed"
              echo
              echo "$reason"
              echo
              echo "A newer Source Discovery chain will reevaluate the same isolation policy."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$reason"
            exit 0
          }
          test "$PROMOTION_MODE" = "isolated-composite"
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$PREVIOUS_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_DECISION_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          test "$CANDIDATE_RUN_ID" != "$PREVIOUS_RUN_ID"
          test -f README.md
          test ! -s README.md
          test "$(git hash-object README.md)" = \
            "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          remote_sha="$(gh api "repos/${REPOSITORY}/commits/main" --jq '.sha')"
          if [ "$remote_sha" != "$EXPECTED_SOURCE_SHA" ] || \
             [ "$(git rev-parse HEAD)" != "$EXPECTED_SOURCE_SHA" ]; then
            close_as_superseded \
              "Main moved after isolated composite selection; the newer chain owns publication."
          fi
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')" = \
            "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          runs="$(
            gh api \
              "repos/${REPOSITORY}/actions/workflows/source-discovery.yml/runs?branch=main&per_page=100"
          )"
          if [ "$(jq -r '.workflow_runs[0].id // empty' <<<"$runs")" != \
               "$CANDIDATE_RUN_ID" ] || \
             [ "$(jq -r '.workflow_runs[1].id // empty' <<<"$runs")" != \
               "$PREVIOUS_RUN_ID" ]; then
            close_as_superseded \
              "The reserved pair is no longer the adjacent latest Source Discovery pair."
          fi

          pair_dir="$(mktemp -d "${RUNNER_TEMP}/project-g-composite-publish.XXXXXX")"
          mkdir -p "$pair_dir/current" "$pair_dir/previous" "$pair_dir/prepared"
          python3 ruleset/scripts/collect_upstream_composite_cycle.py \
            --repository "$REPOSITORY" \
            --run-id "$CANDIDATE_RUN_ID" \
            --expected-main-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir "$pair_dir/current"
          python3 ruleset/scripts/collect_upstream_composite_cycle.py \
            --repository "$REPOSITORY" \
            --run-id "$PREVIOUS_RUN_ID" \
            --expected-main-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir "$pair_dir/previous"
          python3 ruleset/scripts/verify_upstream_composite.py \
            --current-cycle-dir "$pair_dir/current" \
            --previous-cycle-dir "$pair_dir/previous" \
            --expected-main-sha "$EXPECTED_SOURCE_SHA" \
            --repository "$REPOSITORY" \
            --output "$pair_dir/pair-receipt.json" \
            --prepare-current-dir "$pair_dir/prepared"
          test "$(jq -r '.receipt_sha256' "$pair_dir/pair-receipt.json")" = \
            "$EXPECTED_DECISION_FINGERPRINT"
          test "$(jq -r '.decision' "$pair_dir/pair-receipt.json")" = \
            "REQUIRES_PROMOTION_AUTHORIZATION"
          test "$(jq -r '.current.artifact_name' "$pair_dir/pair-receipt.json")" = \
            "$CANDIDATE_ARTIFACT_NAME"
          test "$(jq -r '.previous.artifact_name' "$pair_dir/pair-receipt.json")" = \
            "$PREVIOUS_ARTIFACT_NAME"

          lkg_dir="$pair_dir/lkg"
          mkdir -p "$lkg_dir"
          lkg_binding="$pair_dir/prepared/category-lkg-binding.json"
          release_tag="$(jq -r '.lkg_anchor.release_tag' "$lkg_binding")"
          release_sha="$(jq -r '.lkg_anchor.release_commit_sha' "$lkg_binding")"
          lkg_source_sha="$(jq -r '.lkg_anchor.source_attestation.source_sha' "$lkg_binding")"
          [[ "$release_tag" =~ ^ruleset-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}$ ]]
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$lkg_source_sha" =~ ^[0-9a-f]{40}$ ]]
          gh release download "$release_tag" \
            --repo "$REPOSITORY" \
            --dir "$lkg_dir" \
            --pattern ruleset-dist.tar.gz \
            --pattern ruleset-dist.sha256
          (
            cd "$lkg_dir"
            sha256sum -c ruleset-dist.sha256
          )
          python3 ruleset/scripts/verify_published.py \
            --repository "$REPOSITORY" \
            --sha "$release_sha" \
            --main-sha "$EXPECTED_SOURCE_SHA" \
            --tag "$release_tag" \
            --archive "$lkg_dir/ruleset-dist.tar.gz" \
            --checksum "$lkg_dir/ruleset-dist.sha256" \
            --require-published-status \
            --output-receipt "$lkg_dir/verified-receipt.json"
          gh attestation verify "$lkg_dir/ruleset-dist.tar.gz" \
            --repo "$REPOSITORY" \
            --signer-workflow \
              "${REPOSITORY}/.github/workflows/source-discovery.yml" \
            --signer-digest "$lkg_source_sha" \
            --source-digest "$lkg_source_sha" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$lkg_dir/verified-attestation.json"

          mkdir -p .promotion
          cp -a ruleset/dist .promotion/baseline-dist
          cp -a "$pair_dir/prepared/." .promotion/
          authorized_dist="$pair_dir/authorized-dist"
          mkdir -p "$authorized_dist"
          python3 ruleset/scripts/authorize_upstream_composite.py \
            --pair-receipt "$pair_dir/pair-receipt.json" \
            --prepared-dir "$pair_dir/prepared" \
            --baseline-dist .promotion/baseline-dist \
            --source-config ruleset/config/sources.json \
            --source-registry ruleset/config/source_registry.json \
            --policy ruleset/config/policy_map.json \
            --category-contracts ruleset/config/category_contracts.json \
            --lkg-verified-receipt "$lkg_dir/verified-receipt.json" \
            --lkg-attestation "$lkg_dir/verified-attestation.json" \
            --lkg-archive "$lkg_dir/ruleset-dist.tar.gz" \
            --repository "$REPOSITORY" \
            --expected-main-sha "$EXPECTED_SOURCE_SHA" \
            --output-decision .promotion/composite-promotion-decision.json \
            --output-dist "$authorized_dist"
          cp "$pair_dir/pair-receipt.json" .promotion/composite-pair-receipt.json
          cp "$authorized_dist/candidate_manifest.json" \
            .promotion/candidate-manifest.json
          rsync -a --delete "$authorized_dist/" ruleset/dist/
          echo "continue=true" >> "$GITHUB_OUTPUT"

      - name: Freeze publication reservation outcome
        id: reservation
        if: ${{ !cancelled() }}
        env:
          CANDIDATE_CONTINUE: ${{ steps.candidate_reservation.outputs.continue }}
          COMPOSITE_CONTINUE: ${{ steps.composite_reservation.outputs.continue }}
        run: |
          set -euo pipefail
          case "$PROMOTION_KIND" in
            candidate)
              echo "continue=${CANDIDATE_CONTINUE:-false}" >> "$GITHUB_OUTPUT"
              ;;
            composite)
              echo "continue=${COMPOSITE_CONTINUE:-false}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected promotion kind: $PROMOTION_KIND"
              exit 1
              ;;
          esac

      - name: Apply candidate archive safely
        if: >-
          steps.reservation.outputs.continue == 'true' &&
          env.PROMOTION_KIND == 'candidate'
        run: |
          set -euo pipefail
          cp -a ruleset/dist .promotion/baseline-dist
          extract_dir="${RUNNER_TEMP}/ruleset-promotion"
          mkdir -p "$extract_dir"
          python3 - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path(".promotion/ruleset-dist.tar.gz")
          with tarfile.open(archive, "r:gz") as bundle:
              seen = set()
              for member in bundle.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or not path.parts
                      or path.parts[0] != "dist"
                      or member.issym()
                      or member.islnk()
                      or not (member.isfile() or member.isdir())
                  ):
                      raise SystemExit(f"unsafe archive member: {member.name}")
                  if member.isfile():
                      if member.name in seen:
                          raise SystemExit(
                              f"duplicate archive member: {member.name}"
                          )
                      seen.add(member.name)
          PY
          tar -xzf .promotion/ruleset-dist.tar.gz -C "$extract_dir"
          cmp .promotion/candidate-manifest.json "$extract_dir/dist/candidate_manifest.json"
          cmp .promotion/automated-review.json "$extract_dir/dist/automated_review.json"
          python3 ruleset/scripts/check_automated_review.py \
            --manifest "$extract_dir/dist/candidate_manifest.json" \
            --rule-delta "$extract_dir/dist/rule_delta.json" \
            --contracts "$extract_dir/dist/category_contracts_resolved.json" \
            --canonical-contracts ruleset/config/category_contracts.json \
            --source-config ruleset/config/sources.json \
            --baseline-dist ruleset/dist \
            --current-dist "$extract_dir/dist" \
            --protected-domain-roots ruleset/config/protected_domain_roots.json \
            --repository-root . \
            --provenance "$extract_dir/dist/source_provenance.json" \
            --source-registry ruleset/config/source_registry.json \
            --radar-decision "$extract_dir/dist/source_radar_decision.json" \
            --radar-snapshot "$extract_dir/dist/candidate_sources.json" \
            --output "${RUNNER_TEMP}/extracted-automated-review.json" \
            --require-eligible
          cmp .promotion/automated-review.json \
            "${RUNNER_TEMP}/extracted-automated-review.json"
          rsync -a --delete "$extract_dir/dist/" ruleset/dist/

      - name: Revalidate exact candidate without rebuilding
        if: >-
          steps.reservation.outputs.continue == 'true' &&
          env.PROMOTION_KIND == 'candidate'
        run: |
          set -euo pipefail
          python3 ruleset/scripts/validate_rulesets.py
          python3 ruleset/scripts/check_smoke_probes.py
          python3 ruleset/scripts/check_allowlist_effective.py
          python3 ruleset/scripts/check_automated_review.py \
            --manifest ruleset/dist/candidate_manifest.json \
            --rule-delta ruleset/dist/rule_delta.json \
            --contracts ruleset/dist/category_contracts_resolved.json \
            --canonical-contracts ruleset/config/category_contracts.json \
            --source-config ruleset/config/sources.json \
            --baseline-dist .promotion/baseline-dist \
            --current-dist ruleset/dist \
            --protected-domain-roots ruleset/config/protected_domain_roots.json \
            --repository-root . \
            --provenance ruleset/dist/source_provenance.json \
            --source-registry ruleset/config/source_registry.json \
            --radar-decision ruleset/dist/source_radar_decision.json \
            --radar-snapshot ruleset/dist/candidate_sources.json \
            --output "${RUNNER_TEMP}/revalidated-automated-review.json" \
            --require-eligible
          cmp ruleset/dist/automated_review.json \
            "${RUNNER_TEMP}/revalidated-automated-review.json"
          auto_args=()
          if [ "$PROMOTION_MODE" = "auto-low-risk" ]; then
            auto_args=(--require-auto-promotion-eligible)
          fi
          python3 ruleset/scripts/check_quality_gates.py \
            --current ruleset/dist/policy_reference.json \
            --baseline .promotion/baseline-dist/policy_reference.json \
            --fetch-report ruleset/dist/fetch_report.json \
            --conflicts ruleset/dist/conflicts.json \
            --minimums ruleset/config/min_rules.json \
            --max-fetch-fallbacks 0 \
            --max-cross-action-conflicts 0 \
            --max-high-severity-conflicts 0 \
            --source-provenance ruleset/dist/source_provenance.json \
            --client-parity ruleset/dist/client_parity.json \
            --contracts ruleset/dist/category_contracts_resolved.json \
            --candidate-manifest ruleset/dist/candidate_manifest.json \
            --require-promotable \
            "${auto_args[@]}"

      - name: Revalidate authorized isolated composite without rebuilding
        if: >-
          steps.reservation.outputs.continue == 'true' &&
          env.PROMOTION_KIND == 'composite'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          from ruleset.scripts import verify_upstream_composite as verifier

          archive = pathlib.Path(".promotion/ruleset-dist.tar.gz").read_bytes()
          archived, _manifest = verifier.read_dist_tar(archive)
          current_root = pathlib.Path("ruleset/dist")
          current = {
              path.relative_to(current_root).as_posix(): path.read_bytes()
              for path in sorted(current_root.rglob("*"))
              if path.is_file() and not path.is_symlink()
          }
          if current != archived:
              raise SystemExit("authorized dist differs from exact second-cycle archive")
          decision = verifier.read_json_bytes(
              pathlib.Path(
                  ".promotion/composite-promotion-decision.json"
              ).read_bytes(),
              "composite promotion decision",
          )
          verifier.verify_self_digest(
              decision,
              "decision_sha256",
              "composite promotion decision",
          )
          if (
              decision.get("schema")
              != "project-g-upstream-isolation-promotion-decision-v1"
              or decision.get("eligible") is not True
              or decision.get("publication_authority") is not True
          ):
              raise SystemExit("composite promotion decision is not authoritative")
          PY
          python3 ruleset/scripts/validate_rulesets.py \
            --dist-dir ruleset/dist
          python3 ruleset/scripts/check_smoke_probes.py \
            --config ruleset/config/smoke_probes.json \
            --surge-dir ruleset/dist/surge \
            --openclash-dir ruleset/dist/openclash
          python3 ruleset/scripts/check_allowlist_effective.py \
            --sources ruleset/config/sources.json \
            --root ruleset \
            --surge-dir ruleset/dist/surge \
            --stash-dir ruleset/dist/stash \
            --openclash-dir ruleset/dist/openclash
          python3 ruleset/scripts/check_quality_gates.py \
            --current ruleset/dist/policy_reference.json \
            --baseline .promotion/baseline-dist/policy_reference.json \
            --fetch-report ruleset/dist/fetch_report.json \
            --conflicts ruleset/dist/conflicts.json \
            --minimums ruleset/config/min_rules.json \
            --max-fetch-fallbacks 0 \
            --max-cross-action-conflicts 0 \
            --max-high-severity-conflicts 0 \
            --source-provenance ruleset/dist/source_provenance.json \
            --client-parity ruleset/dist/client_parity.json \
            --contracts ruleset/dist/category_contracts_resolved.json \
            --candidate-manifest ruleset/dist/candidate_manifest.json

      - name: Scan final publish tree for secrets
        if: ${{ steps.reservation.outputs.continue == 'true' }}
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/gitleaks-promotion"
          mkdir -p "$report_dir"
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v "$report_dir:/reports" \
            ghcr.io/gitleaks/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 \
            detect \
            --source /repo \
            --no-git \
            --config /repo/.gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path /reports/gitleaks.sarif

      - name: Prepare candidate commit and snapshot tag
        if: ${{ steps.reservation.outputs.continue == 'true' }}
        id: prepare_snapshot
        run: |
          set -euo pipefail
          test -f README.md
          test ! -s README.md
          test "$(git hash-object README.md)" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          readme_size="$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')"
          readme_blob="$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')"
          test "$readme_size" = "0"
          test "$readme_blob" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ruleset/dist
          unexpected="$(git diff --cached --name-only | grep -Ev '^ruleset/dist/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Refusing unexpected staged paths:"
            echo "$unexpected"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Candidate contains no publishable dist changes."
            exit 1
          fi
          previous_sha="$(git rev-parse HEAD)"
          semantic_digest="$(jq -r '.semantic_digest' ruleset/dist/candidate_manifest.json)"
          git commit -m "chore(ruleset): promote ${semantic_digest:0:12}"
          published_sha="$(git rev-parse HEAD)"
          epoch="$(git show -s --format=%ct HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          tag="ruleset-$(date -u -d "@$epoch" +'%Y%m%dT%H%M%SZ')-$short_sha"
          git tag -a "$tag" -m "ruleset snapshot $tag"

          git fetch --no-tags origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$previous_sha" != "$remote_sha" ]; then
            echo "Source moved before push; refusing to rebase generated output."
            exit 1
          fi
          echo "published_sha=$published_sha" >> "$GITHUB_OUTPUT"
          echo "semantic_digest=$semantic_digest" >> "$GITHUB_OUTPUT"
          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate tag-pinned release notes
        if: ${{ steps.reservation.outputs.continue == 'true' }}
        env:
          SNAPSHOT_TAG: ${{ steps.prepare_snapshot.outputs.tag }}
        run: |
          python3 ruleset/scripts/generate_release_notes.py \
            --repo "$REPOSITORY" \
            --tag "$SNAPSHOT_TAG" \
            --changelog ruleset/dist/CHANGELOG.md \
            --index ruleset/dist/index.json \
            --conflicts ruleset/dist/conflicts.json \
            --fetch-report ruleset/dist/fetch_report.json \
            --output .promotion/release-notes.md

      - name: Publish snapshot tag
        if: ${{ steps.reservation.outputs.continue == 'true' }}
        env:
          SNAPSHOT_TAG: ${{ steps.prepare_snapshot.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          git push origin "refs/tags/$SNAPSHOT_TAG:refs/tags/$SNAPSHOT_TAG"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"

      - name: Create immutable snapshot release
        if: ${{ steps.reservation.outputs.continue == 'true' }}
        env:
          SNAPSHOT_TAG: ${{ steps.prepare_snapshot.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          if gh release view "$SNAPSHOT_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to edit an immutable snapshot."
            exit 1
          fi
          release_assets=(
            .promotion/ruleset-dist.tar.gz
            .promotion/ruleset-dist.sha256
          )
          if [ "$PROMOTION_KIND" = "composite" ]; then
            release_assets+=(
              .promotion/upstream-isolation-composite-evidence.tar
              .promotion/upstream-isolation-composite-evidence.sha256
              .promotion/composite-pair-receipt.json
              .promotion/composite-promotion-decision.json
            )
          fi
          gh release create "$SNAPSHOT_TAG" \
            --repo "$REPOSITORY" \
            --title "Ruleset Snapshot $SNAPSHOT_TAG" \
            --notes-file .promotion/release-notes.md \
            "${release_assets[@]}"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"

      - name: Verify tag, release, assets, tree, and discovery attestation
        if: ${{ steps.reservation.outputs.continue == 'true' }}
        env:
          PUBLISHED_SHA: ${{ steps.prepare_snapshot.outputs.published_sha }}
          SNAPSHOT_TAG: ${{ steps.prepare_snapshot.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python3 ruleset/scripts/verify_published.py \
              --repository "$REPOSITORY" \
              --sha "$PUBLISHED_SHA" \
              --tag "$SNAPSHOT_TAG" \
              --archive .promotion/ruleset-dist.tar.gz \
              --checksum .promotion/ruleset-dist.sha256 \
              --skip-main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
          gh attestation verify .promotion/ruleset-dist.tar.gz \
            --repo "$REPOSITORY" \
            --signer-workflow \
              "${REPOSITORY}/.github/workflows/source-discovery.yml" \
            --signer-digest "$EXPECTED_SOURCE_SHA" \
            --source-digest "$EXPECTED_SOURCE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          if [ "$PROMOTION_KIND" = "composite" ]; then
            supplemental="$(mktemp -d "${RUNNER_TEMP}/project-g-release-evidence.XXXXXX")"
            gh release download "$SNAPSHOT_TAG" \
              --repo "$REPOSITORY" \
              --dir "$supplemental" \
              --pattern upstream-isolation-composite-evidence.tar \
              --pattern upstream-isolation-composite-evidence.sha256 \
              --pattern composite-pair-receipt.json \
              --pattern composite-promotion-decision.json
            for name in \
              upstream-isolation-composite-evidence.tar \
              upstream-isolation-composite-evidence.sha256 \
              composite-pair-receipt.json \
              composite-promotion-decision.json; do
              cmp ".promotion/${name}" "${supplemental}/${name}"
            done
            gh attestation verify \
              .promotion/upstream-isolation-composite-evidence.tar \
              --repo "$REPOSITORY" \
              --signer-workflow \
                "${REPOSITORY}/.github/workflows/source-discovery.yml" \
              --signer-digest "$EXPECTED_SOURCE_SHA" \
              --source-digest "$EXPECTED_SOURCE_SHA" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners
          fi

      - name: Authorize the verified main transition
        if: ${{ steps.reservation.outputs.continue == 'true' }}
        env:
          PUBLISHED_SHA: ${{ steps.prepare_snapshot.outputs.published_sha }}
          SNAPSHOT_TAG: ${{ steps.prepare_snapshot.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          gh api \
            --method POST \
            "repos/${REPOSITORY}/statuses/${PUBLISHED_SHA}" \
            -f state=success \
            -f context='ruleset/gate' \
            -f description='Immutable snapshot, tree, and attestation verified' \
            -f target_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"

      - name: Publish verified snapshot to main
        if: ${{ steps.reservation.outputs.continue == 'true' }}
        env:
          PREVIOUS_SHA: ${{ steps.prepare_snapshot.outputs.previous_sha }}
          PUBLISHED_SHA: ${{ steps.prepare_snapshot.outputs.published_sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          git fetch --no-tags origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$PREVIOUS_SHA" ]; then
            echo "Source moved before verified main publication."
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$PUBLISHED_SHA"
          git push origin "HEAD:refs/heads/main"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"

      - name: Verify published main and immutable snapshot
        if: ${{ steps.reservation.outputs.continue == 'true' }}
        env:
          PUBLISHED_SHA: ${{ steps.prepare_snapshot.outputs.published_sha }}
          SNAPSHOT_TAG: ${{ steps.prepare_snapshot.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python3 ruleset/scripts/verify_published.py \
              --repository "$REPOSITORY" \
              --sha "$PUBLISHED_SHA" \
              --tag "$SNAPSHOT_TAG" \
              --archive .promotion/ruleset-dist.tar.gz \
              --checksum .promotion/ruleset-dist.sha256; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
          gh attestation verify .promotion/ruleset-dist.tar.gz \
            --repo "$REPOSITORY" \
            --signer-workflow \
              "${REPOSITORY}/.github/workflows/source-discovery.yml" \
            --signer-digest "$EXPECTED_SOURCE_SHA" \
            --source-digest "$EXPECTED_SOURCE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          if [ "$PROMOTION_KIND" = "composite" ]; then
            gh attestation verify \
              .promotion/upstream-isolation-composite-evidence.tar \
              --repo "$REPOSITORY" \
              --signer-workflow \
                "${REPOSITORY}/.github/workflows/source-discovery.yml" \
              --signer-digest "$EXPECTED_SOURCE_SHA" \
              --source-digest "$EXPECTED_SOURCE_SHA" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners
          fi

      - name: Record final generated SHA status
        if: ${{ steps.reservation.outputs.continue == 'true' }}
        env:
          PUBLISHED_SHA: ${{ steps.prepare_snapshot.outputs.published_sha }}
          SNAPSHOT_TAG: ${{ steps.prepare_snapshot.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          gh api \
            --method POST \
            "repos/${REPOSITORY}/statuses/${PUBLISHED_SHA}" \
            -f state=success \
            -f context='ruleset/published' \
            -f description='Candidate, tag, release, attestation, raw index, and README verified' \
            -f target_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          {
            echo "## Published snapshot"
            echo
            echo "- Previous main: \`${{ steps.prepare_snapshot.outputs.previous_sha }}\`"
            echo "- Published main: \`${PUBLISHED_SHA}\`"
            echo "- Immutable snapshot tag: \`${SNAPSHOT_TAG}\`"
            echo "- Promotion mode: \`${PROMOTION_MODE}\`"
            echo "- Root README: \`0 bytes\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build exact publication receipt
        if: ${{ steps.reservation.outputs.continue == 'true' }}
        id: receipt
        env:
          PREVIOUS_SHA: ${{ steps.prepare_snapshot.outputs.previous_sha }}
          PUBLISHED_SHA: ${{ steps.prepare_snapshot.outputs.published_sha }}
          SEMANTIC_DIGEST: ${{ steps.prepare_snapshot.outputs.semantic_digest }}
          SNAPSHOT_TAG: ${{ steps.prepare_snapshot.outputs.tag }}
        run: |
          set -euo pipefail
          archive_sha256="$(sha256sum .promotion/ruleset-dist.tar.gz | awk '{print $1}')"
          checksum_sha256="$(awk 'NR == 1 {print $1}' .promotion/ruleset-dist.sha256)"
          test "$archive_sha256" = "$checksum_sha256"
          source_lock_sha256="$(
            jq -r '.source_lock_sha256' .promotion/candidate-manifest.json
          )"
          if [ "$PROMOTION_KIND" = "composite" ]; then
            pair_sha256="$(
              jq -r '.receipt_sha256' .promotion/composite-pair-receipt.json
            )"
            decision_sha256="$(
              jq -r '.decision_sha256' \
                .promotion/composite-promotion-decision.json
            )"
            outer_sha256="$(
              sha256sum \
                .promotion/upstream-isolation-composite-evidence.tar \
                | awk '{print $1}'
            )"
            jq -n \
              --arg schema "project-g-publication-receipt-v2" \
              --arg publication_kind "composite" \
              --arg repository "$REPOSITORY" \
              --arg promotion_run_id "$GITHUB_RUN_ID" \
              --arg source_sha "$EXPECTED_SOURCE_SHA" \
              --arg previous_sha "$PREVIOUS_SHA" \
              --arg published_sha "$PUBLISHED_SHA" \
              --arg snapshot_tag "$SNAPSHOT_TAG" \
              --arg semantic_digest "$SEMANTIC_DIGEST" \
              --arg source_lock_sha256 "$source_lock_sha256" \
              --arg archive_sha256 "$archive_sha256" \
              --arg outer_sha256 "$outer_sha256" \
              --arg pair_sha256 "$pair_sha256" \
              --arg decision_sha256 "$decision_sha256" \
              --slurpfile pair .promotion/composite-pair-receipt.json \
              --slurpfile decision \
                .promotion/composite-promotion-decision.json \
              '{
                schema: $schema,
                publication_kind: $publication_kind,
                repository: $repository,
                promotion_run_id: $promotion_run_id,
                source_sha: $source_sha,
                previous_sha: $previous_sha,
                published_sha: $published_sha,
                snapshot_tag: $snapshot_tag,
                semantic_digest: $semantic_digest,
                source_lock_sha256: $source_lock_sha256,
                archive_sha256: $archive_sha256,
                outer_evidence_sha256: $outer_sha256,
                pair_receipt_sha256: $pair_sha256,
                promotion_decision_sha256: $decision_sha256,
                composite_content_identity: $pair[0].composite_content_identity,
                stable_payload_sha256: $pair[0].stable_payload_sha256,
                containment_boundary_sha256: $pair[0].containment_boundary_sha256,
                stable_selection_fingerprint: $pair[0].stable_selection_fingerprint,
                category_lkg_anchor_sha256: $pair[0].category_lkg_anchor_sha256,
                current: $pair[0].current,
                previous: $pair[0].previous,
                changed_categories: $decision[0].changed_categories
              }' > .promotion/publication-receipt.json
            jq -e \
              '
                .schema == "project-g-publication-receipt-v2"
                and .publication_kind == "composite"
                and (.promotion_run_id | test("^[0-9]+$"))
                and (.source_sha | test("^[0-9a-f]{40}$"))
                and (.published_sha | test("^[0-9a-f]{40}$"))
                and (.semantic_digest | test("^[0-9a-f]{64}$"))
                and (.archive_sha256 | test("^[0-9a-f]{64}$"))
                and (.outer_evidence_sha256 | test("^[0-9a-f]{64}$"))
                and (.pair_receipt_sha256 | test("^[0-9a-f]{64}$"))
                and (.promotion_decision_sha256 | test("^[0-9a-f]{64}$"))
                and (.changed_categories | length) > 0
              ' .promotion/publication-receipt.json >/dev/null
          else
          automated_review_sha256="$(
            sha256sum .promotion/automated-review.json | awk '{print $1}'
          )"
          identity_sha256="$(
            sha256sum .promotion/candidate-identity.json | awk '{print $1}'
          )"
          jq -n \
            --arg schema "project-g-publication-receipt-v1" \
            --arg repository "$REPOSITORY" \
            --arg promotion_run_id "$GITHUB_RUN_ID" \
            --arg candidate_run_id "$CANDIDATE_RUN_ID" \
            --arg candidate_artifact_name "$CANDIDATE_ARTIFACT_NAME" \
            --arg candidate_source_sha "$EXPECTED_SOURCE_SHA" \
            --arg decision_fingerprint "$EXPECTED_DECISION_FINGERPRINT" \
            --arg previous_sha "$PREVIOUS_SHA" \
            --arg published_sha "$PUBLISHED_SHA" \
            --arg snapshot_tag "$SNAPSHOT_TAG" \
            --arg semantic_digest "$SEMANTIC_DIGEST" \
            --arg source_lock_sha256 "$source_lock_sha256" \
            --arg archive_sha256 "$archive_sha256" \
            --arg automated_review_sha256 "$automated_review_sha256" \
            --arg identity_sha256 "$identity_sha256" \
            '{
              schema: $schema,
              repository: $repository,
              promotion_run_id: $promotion_run_id,
              candidate_run_id: $candidate_run_id,
              candidate_artifact_name: $candidate_artifact_name,
              candidate_source_sha: $candidate_source_sha,
              decision_fingerprint: $decision_fingerprint,
              previous_sha: $previous_sha,
              published_sha: $published_sha,
              snapshot_tag: $snapshot_tag,
              semantic_digest: $semantic_digest,
              source_lock_sha256: $source_lock_sha256,
              candidate_archive_sha256: $archive_sha256,
              automated_review_sha256: $automated_review_sha256,
              candidate_identity_sha256: $identity_sha256
            }' > .promotion/publication-receipt.json
          jq -e \
            '
              .schema == "project-g-publication-receipt-v1"
              and (.promotion_run_id | test("^[0-9]+$"))
              and (.candidate_run_id | test("^[0-9]+$"))
              and (.published_sha | test("^[0-9a-f]{40}$"))
              and (.semantic_digest | test("^[0-9a-f]{64}$"))
              and (.candidate_archive_sha256 | test("^[0-9a-f]{64}$"))
            ' .promotion/publication-receipt.json >/dev/null
          fi
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')" = "0"
          echo "artifact_name=ruleset-publication-receipt-${PUBLISHED_SHA}" \
            >> "$GITHUB_OUTPUT"

      - name: Upload immutable publication receipt
        if: ${{ steps.reservation.outputs.continue == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: .promotion/publication-receipt.json

      - name: Forward-rollback an incompletely verified main publication
        if: >-
          steps.reservation.outputs.continue == 'true' &&
          (failure() || cancelled()) &&
          steps.prepare_snapshot.outcome == 'success'
        env:
          PUBLISHED_SHA: ${{ steps.prepare_snapshot.outputs.published_sha }}
          PREVIOUS_SHA: ${{ steps.prepare_snapshot.outputs.previous_sha }}
          SNAPSHOT_TAG: ${{ steps.prepare_snapshot.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" = "$PREVIOUS_SHA" ]; then
            echo "Main was never advanced; no forward rollback is required."
            exit 0
          fi
          if [ "$remote_sha" != "$PUBLISHED_SHA" ]; then
            echo "Main moved after the incomplete publication; refusing blind rollback."
            exit 1
          fi
          test -f README.md
          test ! -s README.md
          test "$(git hash-object README.md)" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          test "$(git rev-parse HEAD)" = "$PUBLISHED_SHA"
          git revert --no-edit "$PUBLISHED_SHA"
          rollback_sha="$(git rev-parse HEAD)"
          if ! git diff --quiet "$PREVIOUS_SHA" "$rollback_sha"; then
            echo "Forward rollback tree does not exactly restore the prior main tree."
            exit 1
          fi
          rollback_tag="${SNAPSHOT_TAG}-forward-rollback"
          git tag -a "$rollback_tag" \
            -m "verified forward rollback for $SNAPSHOT_TAG"
          git push origin "refs/tags/$rollback_tag:refs/tags/$rollback_tag"
          gh api \
            --method POST \
            "repos/${REPOSITORY}/statuses/${rollback_sha}" \
            -f state=success \
            -f context='ruleset/gate' \
            -f description='Verified forward rollback restores the prior main tree' \
            -f target_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/main"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          gh api \
            --method POST \
            "repos/${REPOSITORY}/statuses/${PUBLISHED_SHA}" \
            -f state=failure \
            -f context='ruleset/published' \
            -f description='Publication closure failed; main was restored by a forward commit' \
            -f target_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          {
            echo "## Forward rollback"
            echo
            echo "- Failed snapshot: \`${PUBLISHED_SHA}\`"
            echo "- Prior main: \`${PREVIOUS_SHA}\`"
            echo "- Restoring commit: \`${rollback_sha}\`"
            echo "- Preserved immutable snapshot: \`${SNAPSHOT_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
