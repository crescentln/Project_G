name: Source Discovery
run-name: >-
  Source Discovery ${{ inputs.observation_id || github.sha }}
  attempt-${{ inputs.observation_attempt || '0' }}

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: "Optional exact main SHA required for post-publication convergence"
        required: false
        type: string
      observation_id:
        description: "Optional exact post-publication observation correlation ID"
        required: false
        type: string
      observation_attempt:
        description: "Optional post-publication observation attempt number"
        required: false
        type: string
  push:
    branches:
      - main
  schedule:
    - cron: "23 */12 * * *"

permissions:
  actions: read
  contents: read
  attestations: write
  id-token: write
  statuses: read

concurrency:
  group: ruleset-source-discovery-main
  cancel-in-progress: false
  queue: max

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: ruleset-publication-main
      cancel-in-progress: false
      queue: max
    env:
      MAX_FETCH_FALLBACKS: "30"
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify public README privacy boundary
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          OBSERVATION_ATTEMPT: ${{ inputs.observation_attempt }}
          OBSERVATION_ID: ${{ inputs.observation_id }}
        run: |
          set -euo pipefail
          test -f README.md
          test ! -s README.md
          test "$(git hash-object README.md)" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          if [ -n "${EXPECTED_SOURCE_SHA:-}" ]; then
            if ! [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "expected_source_sha must be an exact lowercase Git SHA."
              exit 1
            fi
            test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          fi
          if [ -n "${OBSERVATION_ID:-}" ]; then
            [[ "$OBSERVATION_ID" =~ ^[0-9a-f]{64}$ ]]
            [[ "$OBSERVATION_ATTEMPT" =~ ^[12]$ ]]
          elif [ -n "${OBSERVATION_ATTEMPT:-}" ]; then
            echo "observation_attempt requires observation_id."
            exit 1
          fi

      - name: Cache source downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ruleset/.cache
          key: ruleset-source-cache-${{ runner.os }}-${{ hashFiles('ruleset/config/sources.json', 'ruleset/config/source_registry.json') }}-${{ github.run_id }}
          restore-keys: |
            ruleset-source-cache-${{ runner.os }}-${{ hashFiles('ruleset/config/sources.json', 'ruleset/config/source_registry.json') }}-
            ruleset-source-cache-${{ runner.os }}-

      - name: Freeze baseline and source revision
        run: |
          set -euo pipefail
          mkdir -p .candidate
          cp -a ruleset/dist "${RUNNER_TEMP}/baseline-dist"
          git rev-parse HEAD > .candidate/source-sha.txt

      - name: Bind immutable published category LKG for shadow planning
        id: category_lkg
        continue-on-error: true
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          lkg_dir="${RUNNER_TEMP}/upstream-isolation-bootstrap"
          mkdir -p "$lkg_dir"
          exact_main_sha="$(tr -d '[:space:]' < .candidate/source-sha.txt)"
          test "$(git rev-parse HEAD)" = "$exact_main_sha"
          test "$(gh api "repos/${REPOSITORY}/commits/main" --jq '.sha')" = \
            "$exact_main_sha"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=${exact_main_sha}" --jq '.size')" = "0"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=${exact_main_sha}" --jq '.sha')" = \
            "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"

          gh api --paginate \
            "repos/${REPOSITORY}/releases?per_page=100" \
            --slurp > "$lkg_dir/release-pages.json"
          selected_release=""
          while IFS= read -r encoded_release; do
            candidate_release="$(printf '%s' "$encoded_release" | base64 -d)"
            candidate_tag="$(jq -r '.tag_name' <<<"$candidate_release")"
            if ! [[ "$candidate_tag" =~ ^ruleset-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}$ ]]; then
              continue
            fi
            if ! tag_ref="$(
              gh api "repos/${REPOSITORY}/git/ref/tags/${candidate_tag}"
            )"; then
              continue
            fi
            object_type="$(jq -r '.object.type' <<<"$tag_ref")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
            for _ in 1 2 3 4; do
              if [ "$object_type" = "commit" ]; then
                break
              fi
              if [ "$object_type" != "tag" ] || \
                 ! tag_object="$(
                   gh api "repos/${REPOSITORY}/git/tags/${object_sha}"
                 )"; then
                object_type="invalid"
                break
              fi
              object_type="$(jq -r '.object.type' <<<"$tag_object")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_object")"
            done
            if [ "$object_type" != "commit" ] || \
               ! [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              continue
            fi
            if ! comparison_status="$(
              gh api \
                "repos/${REPOSITORY}/compare/${object_sha}...${exact_main_sha}" \
                --jq '.status'
            )"; then
              continue
            fi
            if [ "$comparison_status" != "ahead" ] && \
               [ "$comparison_status" != "identical" ]; then
              continue
            fi
            if ! combined_status="$(
              gh api "repos/${REPOSITORY}/commits/${object_sha}/status"
            )"; then
              continue
            fi
            latest_gate_status="$(
              jq -c \
                '[.statuses[] | select(.context == "ruleset/gate")]
                 | sort_by((.updated_at // .created_at // ""), (.id // 0))
                 | last // empty' <<<"$combined_status"
            )"
            latest_published_status="$(
              jq -c \
                '[.statuses[] | select(.context == "ruleset/published")]
                 | sort_by((.updated_at // .created_at // ""), (.id // 0))
                 | last // empty' <<<"$combined_status"
            )"
            if [ -z "$latest_gate_status" ] || \
               [ -z "$latest_published_status" ] || \
               [ "$(jq -r '.state' <<<"$latest_gate_status")" != "success" ] || \
               [ "$(jq -r '.state' <<<"$latest_published_status")" != "success" ] || \
               [ "$(jq -r '.description' <<<"$latest_gate_status")" != \
                 "Immutable snapshot, tree, and attestation verified" ] || \
               [ "$(jq -r '.description' <<<"$latest_published_status")" != \
                 "Candidate, tag, release, attestation, raw index, and README verified" ] || \
               ! jq -e \
                 '.avatar_url
                  | test("^https://avatars\\.githubusercontent\\.com/in/15368(?:\\?.*)?$")' \
                 <<<"$latest_gate_status" >/dev/null || \
               ! jq -e \
                 '.avatar_url
                  | test("^https://avatars\\.githubusercontent\\.com/in/15368(?:\\?.*)?$")' \
                 <<<"$latest_published_status" >/dev/null; then
              continue
            fi
            gate_target_url="$(jq -r '.target_url' <<<"$latest_gate_status")"
            published_target_url="$(
              jq -r '.target_url' <<<"$latest_published_status"
            )"
            if ! [[ "$gate_target_url" =~ ^https://github.com/${REPOSITORY}/actions/runs/([0-9]+)$ ]]; then
              continue
            fi
            gate_run_id="${BASH_REMATCH[1]}"
            if ! [[ "$published_target_url" =~ ^https://github.com/${REPOSITORY}/actions/runs/([0-9]+)$ ]]; then
              continue
            fi
            publication_run_id="${BASH_REMATCH[1]}"
            if [ "$gate_run_id" != "$publication_run_id" ]; then
              continue
            fi
            if ! publication_run="$(
              gh api "repos/${REPOSITORY}/actions/runs/${publication_run_id}"
            )"; then
              continue
            fi
            if ! jq -e \
              --arg repository "$REPOSITORY" \
              '.status == "completed"
               and .conclusion == "success"
               and .path == ".github/workflows/ruleset-update.yml"
               and .repository.full_name == $repository' \
              <<<"$publication_run" >/dev/null; then
              continue
            fi
            printf '%s\n' "$candidate_release" > "$lkg_dir/release.json"
            selected_release="$candidate_tag"
            break
          done < <(
            jq -r \
              '[.[][]
                | select(.immutable == true)
                | select(.draft == false)
                | select(.prerelease == false)]
               | sort_by(.published_at, .id)
               | reverse[]
               | @base64' \
              "$lkg_dir/release-pages.json"
          )
          if [ -z "$selected_release" ]; then
            echo "no canonical immutable release with successful publication evidence" >&2
            exit 1
          fi
          release_id="$(jq -r '.id' "$lkg_dir/release.json")"
          release_tag="$(jq -r '.tag_name' "$lkg_dir/release.json")"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          [[ "$release_tag" =~ ^ruleset-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}$ ]]

          tag_ref="$(gh api "repos/${REPOSITORY}/git/ref/tags/${release_tag}")"
          object_type="$(jq -r '.object.type' <<<"$tag_ref")"
          object_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
          for _ in 1 2 3 4; do
            if [ "$object_type" = "commit" ]; then
              break
            fi
            test "$object_type" = "tag"
            tag_object="$(gh api "repos/${REPOSITORY}/git/tags/${object_sha}")"
            object_type="$(jq -r '.object.type' <<<"$tag_object")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_object")"
          done
          test "$object_type" = "commit"
          release_commit_sha="$object_sha"
          [[ "$release_commit_sha" =~ ^[0-9a-f]{40}$ ]]

          gh release download "$release_tag" \
            --repo "$REPOSITORY" \
            --dir "$lkg_dir" \
            --pattern ruleset-dist.tar.gz \
            --pattern ruleset-dist.sha256 \
            --clobber
          (
            cd "$lkg_dir"
            sha256sum -c ruleset-dist.sha256
          )
          python3 ruleset/scripts/verify_published.py \
            --repository "$REPOSITORY" \
            --sha "$release_commit_sha" \
            --main-sha "$exact_main_sha" \
            --tag "$release_tag" \
            --archive "$lkg_dir/ruleset-dist.tar.gz" \
            --checksum "$lkg_dir/ruleset-dist.sha256" \
            --require-published-status \
            --output-receipt "$lkg_dir/published-receipt.json"

          archive_source_sha="$(
            tar -xOf "$lkg_dir/ruleset-dist.tar.gz" \
              dist/candidate_manifest.json \
              | jq -r '.source_commit_sha'
          )"
          baseline_source_sha="$(
            jq -r '.source_commit_sha' \
              "${RUNNER_TEMP}/baseline-dist/candidate_manifest.json"
          )"
          [[ "$archive_source_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$archive_source_sha" = "$baseline_source_sha"
          gh attestation verify "$lkg_dir/ruleset-dist.tar.gz" \
            --repo "$REPOSITORY" \
            --signer-workflow \
              "${REPOSITORY}/.github/workflows/source-discovery.yml" \
            --source-digest "$archive_source_sha" \
            --format json > "$lkg_dir/verified-attestation.json"
          gh api "repos/${REPOSITORY}/commits/${release_commit_sha}/status" \
            > "$lkg_dir/published-status.json"

          git fetch --no-tags --depth=1 origin "$release_commit_sha"
          release_dist_tree_oid="$(
            git rev-parse "${release_commit_sha}:ruleset/dist"
          )"
          main_dist_tree_oid="$(git rev-parse HEAD:ruleset/dist)"
          release_source_config_blob_oid="$(
            git rev-parse "${release_commit_sha}:ruleset/config/sources.json"
          )"
          release_source_registry_blob_oid="$(
            git rev-parse \
              "${release_commit_sha}:ruleset/config/source_registry.json"
          )"
          git show "${release_commit_sha}:ruleset/config/sources.json" \
            > "$lkg_dir/release-sources.json"
          git show "${release_commit_sha}:ruleset/config/source_registry.json" \
            > "$lkg_dir/release-source-registry.json"

          git fetch --no-tags --depth=1 origin "$archive_source_sha"
          candidate_source_config_blob_oid="$(
            git rev-parse "${archive_source_sha}:ruleset/config/sources.json"
          )"
          candidate_source_registry_blob_oid="$(
            git rev-parse \
              "${archive_source_sha}:ruleset/config/source_registry.json"
          )"
          git show "${archive_source_sha}:ruleset/config/sources.json" \
            > "$lkg_dir/candidate-sources.json"
          git show "${archive_source_sha}:ruleset/config/source_registry.json" \
            > "$lkg_dir/candidate-source-registry.json"

          main_source_config_blob_oid="$(
            git rev-parse HEAD:ruleset/config/sources.json
          )"
          main_source_registry_blob_oid="$(
            git rev-parse HEAD:ruleset/config/source_registry.json
          )"
          cp ruleset/config/sources.json "$lkg_dir/main-sources.json"
          cp \
            ruleset/config/source_registry.json \
            "$lkg_dir/main-source-registry.json"
          binding_args=(
            --repository "$REPOSITORY" \
            --main-sha "$exact_main_sha" \
            --release-json "$lkg_dir/release.json" \
            --release-commit-sha "$release_commit_sha" \
            --release-dist-tree-oid "$release_dist_tree_oid" \
            --main-dist-tree-oid "$main_dist_tree_oid" \
            --candidate-source-config "$lkg_dir/candidate-sources.json" \
            --candidate-source-config-blob-oid \
              "$candidate_source_config_blob_oid" \
            --release-source-config "$lkg_dir/release-sources.json" \
            --release-source-config-blob-oid "$release_source_config_blob_oid" \
            --main-source-config "$lkg_dir/main-sources.json" \
            --main-source-config-blob-oid "$main_source_config_blob_oid" \
            --candidate-source-registry \
              "$lkg_dir/candidate-source-registry.json" \
            --candidate-source-registry-blob-oid \
              "$candidate_source_registry_blob_oid" \
            --release-source-registry \
              "$lkg_dir/release-source-registry.json" \
            --release-source-registry-blob-oid \
              "$release_source_registry_blob_oid" \
            --main-source-registry "$lkg_dir/main-source-registry.json" \
            --main-source-registry-blob-oid "$main_source_registry_blob_oid" \
            --archive "$lkg_dir/ruleset-dist.tar.gz" \
            --checksum "$lkg_dir/ruleset-dist.sha256" \
            --baseline-dist "${RUNNER_TEMP}/baseline-dist" \
            --attestation-json "$lkg_dir/verified-attestation.json" \
            --published-receipt-json "$lkg_dir/published-receipt.json" \
          )
          python3 ruleset/scripts/build_category_lkg_binding.py \
            "${binding_args[@]}" \
            --published-status-json "$lkg_dir/published-status.json" \
            --output "$lkg_dir/category-lkg-binding.json"

          gh api --paginate \
            "repos/${REPOSITORY}/releases?per_page=100" \
            --slurp > "$lkg_dir/final-release-pages.json"
          jq -e \
            --argjson release_id "$release_id" \
            '.[][]
             | select(.id == $release_id)
             | select(.immutable == true)
             | select(.draft == false)
             | select(.prerelease == false)' \
            "$lkg_dir/final-release-pages.json" >/dev/null
          test "$(gh api "repos/${REPOSITORY}/commits/main" --jq '.sha')" = \
            "$exact_main_sha"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${REPOSITORY}/contents/README.md?ref=main" --jq '.sha')" = \
            "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          gh api "repos/${REPOSITORY}/commits/${release_commit_sha}/status" \
            > "$lkg_dir/final-published-status.json"
          python3 ruleset/scripts/build_category_lkg_binding.py \
            "${binding_args[@]}" \
            --published-status-json "$lkg_dir/final-published-status.json" \
            --output "$lkg_dir/final-category-lkg-binding.json"
          cmp \
            "$lkg_dir/category-lkg-binding.json" \
            "$lkg_dir/final-category-lkg-binding.json"
          echo "binding_sha256=$(jq -r '.binding_sha256' "$lkg_dir/category-lkg-binding.json")" \
            >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable source lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 ruleset/scripts/resolve_source_lock.py \
            --sources ruleset/config/sources.json \
            --output .candidate/sources.lock.json

      - name: Build isolated candidate
        timeout-minutes: 45
        run: |
          set -euo pipefail
          python3 ruleset/scripts/build_rulesets.py \
            --source-lock .candidate/sources.lock.json \
            --baseline-dist "${RUNNER_TEMP}/baseline-dist" \
            --fail-on-cross-action-conflicts

      - name: Generate client templates
        run: |
          python3 ruleset/scripts/generate_recommended_templates.py \
            --policy-reference ruleset/dist/policy_reference.json \
            --index ruleset/dist/index.json \
            --openclash-out ruleset/dist/recommended_openclash.yaml \
            --surge-out ruleset/dist/recommended_surge.conf \
            --stash-out ruleset/dist/recommended_stash.yaml \
            --stash-native-out ruleset/dist/recommended_stash_native.yaml \
            --raw-base-url "https://raw.githubusercontent.com/${{ github.repository }}/main/ruleset/dist"

      - name: Run candidate-only radar against the published baseline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          baseline_args=()
          if [ -f "${RUNNER_TEMP}/baseline-dist/candidate_sources.json" ]; then
            baseline_args=(--baseline "${RUNNER_TEMP}/baseline-dist/candidate_sources.json")
          fi
          python3 ruleset/scripts/discover_source_radar.py \
            --config ruleset/config/source_radar.json \
            --source-lock .candidate/sources.lock.json \
            --provenance ruleset/dist/source_provenance.json \
            "${baseline_args[@]}" \
            --output ruleset/dist/candidate_sources.json
          python3 ruleset/scripts/apply_radar_decision.py \
            --manifest ruleset/dist/candidate_manifest.json \
            --radar ruleset/dist/candidate_sources.json \
            --decision-output ruleset/dist/source_radar_decision.json

      - name: Validate formats and semantic contracts
        run: |
          set -euo pipefail
          python3 ruleset/scripts/validate_rulesets.py
          python3 ruleset/scripts/check_smoke_probes.py
          python3 ruleset/scripts/check_allowlist_effective.py
          approved_args=()
          if [ -f ruleset/config/approved_count_drift.json ]; then
            approved_args=(--approved-drift ruleset/config/approved_count_drift.json)
          fi
          python3 ruleset/scripts/check_quality_gates.py \
            --current ruleset/dist/policy_reference.json \
            --baseline "${RUNNER_TEMP}/baseline-dist/policy_reference.json" \
            "${approved_args[@]}" \
            --fetch-report ruleset/dist/fetch_report.json \
            --conflicts ruleset/dist/conflicts.json \
            --minimums ruleset/config/min_rules.json \
            --max-fetch-fallbacks "${MAX_FETCH_FALLBACKS}" \
            --max-cross-action-conflicts 0 \
            --max-high-severity-conflicts 0 \
            --source-provenance ruleset/dist/source_provenance.json \
            --client-parity ruleset/dist/client_parity.json \
            --contracts ruleset/dist/category_contracts_resolved.json \
            --candidate-manifest ruleset/dist/candidate_manifest.json

      - name: Build deterministic automated review evidence
        run: |
          set -euo pipefail
          python3 ruleset/scripts/check_automated_review.py \
            --manifest ruleset/dist/candidate_manifest.json \
            --rule-delta ruleset/dist/rule_delta.json \
            --contracts ruleset/dist/category_contracts_resolved.json \
            --canonical-contracts ruleset/config/category_contracts.json \
            --source-config ruleset/config/sources.json \
            --baseline-dist "${RUNNER_TEMP}/baseline-dist" \
            --current-dist ruleset/dist \
            --protected-domain-roots ruleset/config/protected_domain_roots.json \
            --repository-root . \
            --provenance ruleset/dist/source_provenance.json \
            --source-registry ruleset/config/source_registry.json \
            --radar-decision ruleset/dist/source_radar_decision.json \
            --radar-snapshot ruleset/dist/candidate_sources.json \
            --output ruleset/dist/automated_review.json

      - name: Build non-authoritative upstream isolation shadow plan
        id: isolation_shadow
        if: steps.category_lkg.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          shadow_dir="${RUNNER_TEMP}/upstream-isolation-shadow"
          python3 ruleset/scripts/check_automated_review.py \
            --manifest ruleset/dist/candidate_manifest.json \
            --rule-delta ruleset/dist/rule_delta.json \
            --contracts ruleset/dist/category_contracts_resolved.json \
            --canonical-contracts ruleset/config/category_contracts.json \
            --source-config ruleset/config/sources.json \
            --baseline-dist "${RUNNER_TEMP}/baseline-dist" \
            --current-dist ruleset/dist \
            --protected-domain-roots ruleset/config/protected_domain_roots.json \
            --repository-root . \
            --provenance ruleset/dist/source_provenance.json \
            --source-registry ruleset/config/source_registry.json \
            --radar-decision ruleset/dist/source_radar_decision.json \
            --radar-snapshot ruleset/dist/candidate_sources.json \
            --output "$shadow_dir/replayed-automated-review.json" \
            --isolation-output "$shadow_dir/isolation-evidence.json"
          cmp \
            ruleset/dist/automated_review.json \
            "$shadow_dir/replayed-automated-review.json"
          python3 ruleset/scripts/plan_upstream_isolation.py \
            --automated-review ruleset/dist/automated_review.json \
            --isolation-evidence "$shadow_dir/isolation-evidence.json" \
            --source-config ruleset/config/sources.json \
            --source-registry ruleset/config/source_registry.json \
            --baseline-dist "${RUNNER_TEMP}/baseline-dist" \
            --candidate-dist ruleset/dist \
            --published-lkg-binding \
              "${RUNNER_TEMP}/upstream-isolation-bootstrap/category-lkg-binding.json" \
            --exact-main-sha "$(tr -d '[:space:]' < .candidate/source-sha.txt)" \
            --source-root ruleset \
            --output "$shadow_dir/upstream-isolation-plan.json"
          fingerprint="$(
            jq -r '.plan_fingerprint' "$shadow_dir/upstream-isolation-plan.json"
          )"
          source_sha="$(tr -d '[:space:]' < .candidate/source-sha.txt)"
          if ! [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid upstream isolation shadow fingerprint."
            exit 1
          fi
          if ! [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA for upstream isolation shadow evidence."
            exit 1
          fi
          mkdir -p "$shadow_dir/payload"
          mv "$shadow_dir/isolation-evidence.json" "$shadow_dir/payload/"
          mv "$shadow_dir/upstream-isolation-plan.json" "$shadow_dir/payload/"
          cp \
            "${RUNNER_TEMP}/upstream-isolation-bootstrap/category-lkg-binding.json" \
            "$shadow_dir/payload/category-lkg-binding.json"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "stable_selection_fingerprint=$(jq -r '.stable_selection_fingerprint' "$shadow_dir/payload/upstream-isolation-plan.json")" \
            >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "## Upstream isolation shadow"
            echo
            jq -r '"- Mode: `" + .mode + "`\n- Enforcement ready: `" + (.enforcement_ready|tostring) + "`\n- Category LKG bound: `" + (.category_lkg_bootstrap_bound|tostring) + "`\n- Accepted candidate categories: `" + ((.accepted_candidate_categories // []) | join(", ")) + "`\n- Quarantined categories: `" + ((.quarantined_categories // []) | join(", ")) + "`\n- Safe slice changed: `" + (.safe_slice_changed|tostring) + "`\n- Planned safe delta count: `" + (.planned_safe_delta_count|tostring) + "`\n- Publishable safe delta count: `" + (.publishable_safe_delta_count|tostring) + "`\n- Stable selection fingerprint: `" + .stable_selection_fingerprint + "`\n- Exact observation fingerprint: `" + .plan_fingerprint + "`"' \
              "$shadow_dir/payload/upstream-isolation-plan.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Materialize non-authoritative upstream isolation composite
        id: isolation_composite
        if: steps.isolation_shadow.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source_sha="$(tr -d '[:space:]' < .candidate/source-sha.txt)"
          generated_at="$(git show -s --format=%cI "$source_sha")"
          composite_dir="$(mktemp -d)"
          shadow_payload="${RUNNER_TEMP}/upstream-isolation-shadow/payload"
          python3 ruleset/scripts/materialize_upstream_composite.py \
            --plan "$shadow_payload/upstream-isolation-plan.json" \
            --isolation-evidence "$shadow_payload/isolation-evidence.json" \
            --lkg-binding "$shadow_payload/category-lkg-binding.json" \
            --candidate-dist ruleset/dist \
            --lkg-dist "${RUNNER_TEMP}/baseline-dist" \
            --source-config ruleset/config/sources.json \
            --policy ruleset/config/policy_map.json \
            --source-registry ruleset/config/source_registry.json \
            --category-contracts ruleset/config/category_contracts.json \
            --source-root ruleset \
            --exact-main-sha "$source_sha" \
            --generated-at-utc "$generated_at" \
            --output-dist "$composite_dir/dist" \
            --output-identity "$composite_dir/composite-identity.json" \
            --output-review "$composite_dir/composite-review.json"
          python3 ruleset/scripts/validate_rulesets.py \
            --dist-dir "$composite_dir/dist"
          python3 ruleset/scripts/check_smoke_probes.py \
            --config ruleset/config/smoke_probes.json \
            --surge-dir "$composite_dir/dist/surge" \
            --openclash-dir "$composite_dir/dist/openclash"
          python3 ruleset/scripts/check_allowlist_effective.py \
            --sources ruleset/config/sources.json \
            --root ruleset \
            --surge-dir "$composite_dir/dist/surge" \
            --stash-dir "$composite_dir/dist/stash" \
            --openclash-dir "$composite_dir/dist/openclash"
          approved_args=()
          if [ -f ruleset/config/approved_count_drift.json ]; then
            approved_args=(--approved-drift ruleset/config/approved_count_drift.json)
          fi
          python3 ruleset/scripts/check_quality_gates.py \
            --current "$composite_dir/dist/policy_reference.json" \
            --baseline "${RUNNER_TEMP}/baseline-dist/policy_reference.json" \
            "${approved_args[@]}" \
            --fetch-report "$composite_dir/dist/fetch_report.json" \
            --conflicts "$composite_dir/dist/conflicts.json" \
            --minimums ruleset/config/min_rules.json \
            --max-fetch-fallbacks 0 \
            --max-cross-action-conflicts 0 \
            --max-high-severity-conflicts 0 \
            --source-provenance "$composite_dir/dist/source_provenance.json" \
            --client-parity "$composite_dir/dist/client_parity.json" \
            --contracts "$composite_dir/dist/category_contracts_resolved.json" \
            --candidate-manifest "$composite_dir/dist/candidate_manifest.json"
          jq -e \
            '.mode == "shadow-only"
             and .enforcement_ready == false
             and .two_cycle_enforcement_eligible == false
             and .source_health_complete == false
             and .licensing_assertions_complete == false
             and (.composite_content_identity
                  | test("^[0-9a-f]{64}$"))
             and (.observation_evidence_identity
                  | test("^[0-9a-f]{64}$"))
             and (.dist_tree_sha256 | test("^[0-9a-f]{64}$"))' \
            "$composite_dir/composite-identity.json" >/dev/null
          jq -e \
            '.mode == "shadow-only"
             and .materialization_valid == true
             and .validation_complete == false
             and .publishable == false
             and .enforcement_ready == false
             and .source_health_status == "unknown"
             and .source_health_complete == false
             and .licensing_assertions_complete == false
             and .complete_category_bundles == true
             and .repository_atomicity_preserved == true
             and .category_removals_allowed == false
             and .cross_action_conflict_count == 0
             and .high_severity_conflict_count == 0' \
            "$composite_dir/composite-review.json" >/dev/null
          identity_sha256="$(
            sha256sum "$composite_dir/composite-identity.json" | awk '{print $1}'
          )"
          review_sha256="$(
            sha256sum "$composite_dir/composite-review.json" | awk '{print $1}'
          )"
          content_identity="$(
            jq -r '.composite_content_identity' \
              "$composite_dir/composite-identity.json"
          )"
          observation_identity="$(
            jq -r '.observation_evidence_identity' \
              "$composite_dir/composite-identity.json"
          )"
          dist_tree_sha256="$(
            jq -r '.dist_tree_sha256' "$composite_dir/composite-identity.json"
          )"
          gate_receipt_base="$(mktemp)"
          jq -n \
            --arg exact_main_sha "$source_sha" \
            --arg content_identity "$content_identity" \
            --arg observation_identity "$observation_identity" \
            --arg dist_tree_sha256 "$dist_tree_sha256" \
            --arg identity_sha256 "$identity_sha256" \
            --arg review_sha256 "$review_sha256" \
            '{
              schema: "project-g-upstream-isolation-composite-gate-v1",
              mode: "shadow-only",
              valid: true,
              publishable: false,
              source_health_complete: false,
              licensing_assertions_complete: false,
              exact_main_sha: $exact_main_sha,
              composite_content_identity: $content_identity,
              observation_evidence_identity: $observation_identity,
              dist_tree_sha256: $dist_tree_sha256,
              identity_file_sha256: $identity_sha256,
              review_file_sha256: $review_sha256,
              completed_gates: [
                "validate-rulesets",
                "smoke-probes",
                "allowlist-effective",
                "quality-gates"
              ]
            }' > "$gate_receipt_base"
          gate_receipt_sha256="$(
            jq -S -c . "$gate_receipt_base" | sha256sum | awk '{print $1}'
          )"
          jq \
            --arg receipt_sha256 "$gate_receipt_sha256" \
            '.receipt_sha256 = $receipt_sha256' \
            "$gate_receipt_base" \
            | jq -S . > "$composite_dir/composite-gate-receipt.json"
          jq -e \
            '.mode == "shadow-only"
             and .valid == true
             and .publishable == false
             and .source_health_complete == false
             and .licensing_assertions_complete == false
             and (.completed_gates | length) == 4
             and (.receipt_sha256 | test("^[0-9a-f]{64}$"))' \
            "$composite_dir/composite-gate-receipt.json" >/dev/null
          test "$(
            jq 'del(.receipt_sha256)' \
              "$composite_dir/composite-gate-receipt.json" \
              | jq -S -c . | sha256sum | awk '{print $1}'
          )" = "$gate_receipt_sha256"
          echo "composite_dir=$composite_dir" >> "$GITHUB_OUTPUT"
          echo "content_identity=$content_identity" >> "$GITHUB_OUTPUT"
          echo "dist_tree_sha256=$dist_tree_sha256" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "## Upstream isolation composite shadow"
            echo
            jq -r \
              '"- Mode: `" + .mode
               + "`\n- Enforcement ready: `" + (.enforcement_ready|tostring)
               + "`\n- Content identity: `" + .composite_content_identity
               + "`\n- Dist tree SHA-256: `" + .dist_tree_sha256
               + "`\n- Dist file count: `" + (.dist_file_count|tostring)
               + "`\n- Semantic digest: `" + .semantic_digest + "`"' \
              "$composite_dir/composite-identity.json"
            jq -r \
              '"- Changed categories: `" + ((.changed_categories // []) | join(", "))
               + "`\n- Candidate categories: `" + (.candidate_category_count|tostring)
               + "`\n- Published LKG categories: `" + (.published_lkg_category_count|tostring)
               + "`\n- Derived categories: `" + (.derived_category_count|tostring) + "`"' \
              "$composite_dir/composite-review.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan upstream isolation composite for secrets
        id: isolation_composite_scan
        if: steps.isolation_composite.outcome == 'success'
        continue-on-error: true
        env:
          COMPOSITE_DIR: ${{ steps.isolation_composite.outputs.composite_dir }}
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/gitleaks-composite"
          mkdir -p "$report_dir"
          docker run --rm \
            -v "$PWD/.gitleaks.toml:/gitleaks.toml:ro" \
            -v "${COMPOSITE_DIR}:/composite:ro" \
            -v "$report_dir:/reports" \
            ghcr.io/gitleaks/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 \
            detect \
            --source /composite \
            --no-git \
            --config /gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path /reports/gitleaks-composite.sarif
          cp \
            "$report_dir/gitleaks-composite.sarif" \
            "$COMPOSITE_DIR/gitleaks-composite.sarif"

      - name: Package scanned upstream isolation composite
        id: isolation_composite_package
        if: >-
          steps.isolation_composite.outcome == 'success' &&
          steps.isolation_composite_scan.outcome == 'success'
        continue-on-error: true
        env:
          COMPOSITE_DIR: ${{ steps.isolation_composite.outputs.composite_dir }}
          CONTENT_IDENTITY: ${{ steps.isolation_composite.outputs.content_identity }}
          SOURCE_SHA: ${{ steps.isolation_shadow.outputs.source_sha }}
        run: |
          set -euo pipefail
          tar \
            --format=ustar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf - \
            -C "$COMPOSITE_DIR" dist \
            | gzip -n > "$COMPOSITE_DIR/ruleset-composite-dist.tar.gz"
          (
            cd "$COMPOSITE_DIR"
            sha256sum ruleset-composite-dist.tar.gz \
              > ruleset-composite-dist.sha256
          )
          archive_sha256="$(
            awk '{print $1}' "$COMPOSITE_DIR/ruleset-composite-dist.sha256"
          )"
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          (
            cd "$COMPOSITE_DIR"
            sha256sum \
              composite-gate-receipt.json \
              composite-identity.json \
              composite-review.json \
              gitleaks-composite.sarif \
              ruleset-composite-dist.tar.gz \
              ruleset-composite-dist.sha256 \
              > composite-evidence-checksums.sha256
          )
          tar \
            --format=ustar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf "$COMPOSITE_DIR/upstream-isolation-composite-evidence.tar" \
            -C "$COMPOSITE_DIR" \
              composite-evidence-checksums.sha256 \
              composite-gate-receipt.json \
              composite-identity.json \
              composite-review.json \
              gitleaks-composite.sarif \
              ruleset-composite-dist.tar.gz \
              ruleset-composite-dist.sha256
          (
            cd "$COMPOSITE_DIR"
            sha256sum upstream-isolation-composite-evidence.tar \
              > upstream-isolation-composite-evidence.sha256
          )
          evidence_sha256="$(
            awk '{print $1}' \
              "$COMPOSITE_DIR/upstream-isolation-composite-evidence.sha256"
          )"
          [[ "$evidence_sha256" =~ ^[0-9a-f]{64}$ ]]
          artifact_name="ruleset-isolation-composite-shadow-${SOURCE_SHA}-${CONTENT_IDENTITY}-${archive_sha256}"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "evidence_sha256=$evidence_sha256" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Verify remote README before composite attestation
        id: isolation_composite_readme_before
        if: steps.isolation_composite_package.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${{ github.repository }}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${{ github.repository }}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"

      - name: Attest upstream isolation composite evidence
        id: isolation_composite_attest
        if: >-
          steps.isolation_composite_package.outcome == 'success' &&
          steps.isolation_composite_readme_before.outcome == 'success'
        continue-on-error: true
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.isolation_composite.outputs.composite_dir }}/upstream-isolation-composite-evidence.tar

      - name: Recheck README after composite attestation
        id: isolation_composite_readme_after
        if: steps.isolation_composite_attest.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${{ github.repository }}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${{ github.repository }}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"

      - name: Upload attested upstream isolation composite
        id: isolation_composite_upload
        if: >-
          steps.isolation_composite_attest.outcome == 'success' &&
          steps.isolation_composite_readme_after.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.isolation_composite_package.outputs.artifact_name }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: |
            ${{ steps.isolation_composite.outputs.composite_dir }}/upstream-isolation-composite-evidence.tar
            ${{ steps.isolation_composite.outputs.composite_dir }}/upstream-isolation-composite-evidence.sha256

      - name: Update candidate changelog
        run: |
          python3 ruleset/scripts/update_dist_changelog.py \
            --current-policy ruleset/dist/policy_reference.json \
            --baseline-policy "${RUNNER_TEMP}/baseline-dist/policy_reference.json" \
            --conflicts ruleset/dist/conflicts.json \
            --fetch-report ruleset/dist/fetch_report.json \
            --output ruleset/dist/CHANGELOG.md

      - name: Scan source and candidate for secrets
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/gitleaks-discovery"
          mkdir -p "$report_dir"
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v "$report_dir:/reports" \
            ghcr.io/gitleaks/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 \
            detect \
            --source /repo \
            --no-git \
            --config /repo/.gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path /reports/gitleaks.sarif
          cp "$report_dir/gitleaks.sarif" .candidate/gitleaks-source-discovery.sarif

      - name: Scan upstream isolation shadow evidence for secrets
        id: isolation_scan
        if: steps.isolation_shadow.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          shadow_dir="${RUNNER_TEMP}/upstream-isolation-shadow"
          report_dir="$shadow_dir/gitleaks-report"
          mkdir -p "$report_dir"
          docker run --rm \
            -v "$PWD/.gitleaks.toml:/gitleaks.toml:ro" \
            -v "$shadow_dir/payload:/shadow:ro" \
            -v "$report_dir:/reports" \
            ghcr.io/gitleaks/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 \
            detect \
            --source /shadow \
            --no-git \
            --config /gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path /reports/gitleaks-shadow.sarif
          cp \
            "$report_dir/gitleaks-shadow.sarif" \
            "$shadow_dir/payload/gitleaks-shadow.sarif"

      - name: Package scanned upstream isolation shadow evidence
        id: isolation_package
        if: >-
          steps.isolation_shadow.outcome == 'success' &&
          steps.isolation_scan.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          shadow_dir="${RUNNER_TEMP}/upstream-isolation-shadow"
          (
            cd "$shadow_dir/payload"
            sha256sum \
              category-lkg-binding.json \
              gitleaks-shadow.sarif \
              isolation-evidence.json \
              upstream-isolation-plan.json \
              > checksums.sha256
          )
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf "$shadow_dir/upstream-isolation-shadow.tar" \
            -C "$shadow_dir/payload" .
          (
            cd "$shadow_dir"
            sha256sum upstream-isolation-shadow.tar \
              > upstream-isolation-shadow.sha256
          )
          artifact_name="ruleset-isolation-shadow-${{ steps.isolation_shadow.outputs.source_sha }}-${{ steps.isolation_shadow.outputs.fingerprint }}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Verify remote README before shadow attestation
        id: isolation_readme_before
        if: steps.isolation_package.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${{ github.repository }}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${{ github.repository }}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"

      - name: Attest upstream isolation shadow evidence
        id: isolation_attest
        if: >-
          steps.isolation_package.outcome == 'success' &&
          steps.isolation_readme_before.outcome == 'success'
        continue-on-error: true
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/upstream-isolation-shadow/upstream-isolation-shadow.tar

      - name: Recheck README after shadow attestation
        id: isolation_readme_after
        if: steps.isolation_attest.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${{ github.repository }}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${{ github.repository }}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"

      - name: Upload attested upstream isolation shadow archive
        id: isolation_upload
        if: >-
          steps.isolation_attest.outcome == 'success' &&
          steps.isolation_readme_after.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.isolation_package.outputs.artifact_name }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: |
            ${{ runner.temp }}/upstream-isolation-shadow/upstream-isolation-shadow.tar
            ${{ runner.temp }}/upstream-isolation-shadow/upstream-isolation-shadow.sha256

      - name: Record non-authoritative shadow outcome
        if: always()
        env:
          LKG_OUTCOME: ${{ steps.category_lkg.outcome }}
          PLAN_OUTCOME: ${{ steps.isolation_shadow.outcome }}
          SCAN_OUTCOME: ${{ steps.isolation_scan.outcome }}
          PACKAGE_OUTCOME: ${{ steps.isolation_package.outcome }}
          ATTEST_OUTCOME: ${{ steps.isolation_attest.outcome }}
          UPLOAD_OUTCOME: ${{ steps.isolation_upload.outcome }}
          COMPOSITE_OUTCOME: ${{ steps.isolation_composite.outcome }}
          COMPOSITE_SCAN_OUTCOME: ${{ steps.isolation_composite_scan.outcome }}
          COMPOSITE_PACKAGE_OUTCOME: ${{ steps.isolation_composite_package.outcome }}
          COMPOSITE_ATTEST_OUTCOME: ${{ steps.isolation_composite_attest.outcome }}
          COMPOSITE_UPLOAD_OUTCOME: ${{ steps.isolation_composite_upload.outcome }}
        run: |
          {
            echo
            echo "- Category LKG binding outcome: \`${LKG_OUTCOME:-skipped}\`"
            echo "- Shadow plan outcome: \`${PLAN_OUTCOME:-skipped}\`"
            echo "- Shadow secret scan outcome: \`${SCAN_OUTCOME:-skipped}\`"
            echo "- Shadow package outcome: \`${PACKAGE_OUTCOME:-skipped}\`"
            echo "- Shadow attestation outcome: \`${ATTEST_OUTCOME:-skipped}\`"
            echo "- Shadow upload outcome: \`${UPLOAD_OUTCOME:-skipped}\`"
            echo "- Composite materialization outcome: \`${COMPOSITE_OUTCOME:-skipped}\`"
            echo "- Composite secret scan outcome: \`${COMPOSITE_SCAN_OUTCOME:-skipped}\`"
            echo "- Composite package outcome: \`${COMPOSITE_PACKAGE_OUTCOME:-skipped}\`"
            echo "- Composite attestation outcome: \`${COMPOSITE_ATTEST_OUTCOME:-skipped}\`"
            echo "- Composite upload outcome: \`${COMPOSITE_UPLOAD_OUTCOME:-skipped}\`"
            if [ "${UPLOAD_OUTCOME:-skipped}" != "success" ]; then
              echo "- Shadow evidence unavailable; candidate decision and packaging continue unchanged."
            fi
            if [ "${COMPOSITE_UPLOAD_OUTCOME:-skipped}" != "success" ]; then
              echo "- Composite shadow unavailable; Promotion still ignores composite artifacts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate discovery summary
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f ruleset/dist/candidate_manifest.json ]; then
            echo "Candidate manifest unavailable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 ruleset/scripts/generate_run_summary.py \
            --current-policy ruleset/dist/policy_reference.json \
            --baseline-policy "${RUNNER_TEMP}/baseline-dist/policy_reference.json" \
            --conflicts ruleset/dist/conflicts.json \
            --fetch-report ruleset/dist/fetch_report.json \
            --minimums ruleset/config/min_rules.json \
            --output .candidate/discovery-summary.md
          cat .candidate/discovery-summary.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "## Candidate decision"
            echo
            jq -r '"- Semantic digest: `" + .semantic_digest + "`\n- Risk: `" + .risk_level + "`\n- Changed: `" + (.changed|tostring) + "`\n- Legacy low-risk eligibility: `" + (.auto_promotion_eligible|tostring) + "`\n- Elevated evidence required: `" + (.requires_review|tostring) + "`\n- Risk markers: `" + ((.risk_markers // []) | join(", ")) + "`\n- Budget exceeded: `" + ((.budget_exceeded // []) | join("; ")) + "`"' ruleset/dist/candidate_manifest.json
            jq -r '"- Automated evidence eligible: `" + (.eligible|tostring) + "`\n- Automated review policy: `" + .review_policy + "`\n- Required stable cycles: `" + (.required_stable_cycles|tostring) + "`\n- Minimum cycle separation: `" + (.minimum_cycle_separation_seconds|tostring) + "s`\n- Automated blocker count: `" + ((.blockers // []) | length | tostring) + "`\n- First automated blockers: `" + ((.blockers // [])[0:20] | join("; ")) + "`"' ruleset/dist/automated_review.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package immutable candidate
        id: package
        env:
          OBSERVATION_ATTEMPT: ${{ inputs.observation_attempt }}
          OBSERVATION_ID: ${{ inputs.observation_id }}
        run: |
          set -euo pipefail
          source_sha="$(tr -d '[:space:]' < .candidate/source-sha.txt)"
          manifest_tmp="$(mktemp ruleset/dist/.candidate-manifest.XXXXXXXXXX)"
          jq --arg source_commit_sha "$source_sha" \
            '.source_commit_sha = $source_commit_sha' \
            ruleset/dist/candidate_manifest.json > "$manifest_tmp"
          mv "$manifest_tmp" ruleset/dist/candidate_manifest.json
          semantic_digest="$(jq -r '.semantic_digest' ruleset/dist/candidate_manifest.json)"
          risk_level="$(jq -r '.risk_level' ruleset/dist/candidate_manifest.json)"
          if ! [[ "$semantic_digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid semantic digest."
            exit 1
          fi
          case "$risk_level" in
            none|low|high) ;;
            *) echo "Invalid risk level: $risk_level"; exit 1 ;;
          esac
          python3 ruleset/scripts/build_candidate_identity.py \
            --manifest ruleset/dist/candidate_manifest.json \
            --radar-decision ruleset/dist/source_radar_decision.json \
            --automated-review ruleset/dist/automated_review.json \
            --source-sha "$source_sha" \
            --workflow .github/workflows/source-discovery.yml \
            --identity-output .candidate/candidate-identity.json \
            --decision-output .candidate/candidate-decision.json \
            --fingerprint-output .candidate/decision-fingerprint.txt
          decision_fingerprint="$(
            tr -d '[:space:]' < .candidate/decision-fingerprint.txt
          )"
          if ! [[ "$decision_fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid decision fingerprint."
            exit 1
          fi
          identity_digest="$(sha256sum .candidate/candidate-identity.json | awk '{print $1}')"
          artifact_name="ruleset-candidate-${risk_level}-${semantic_digest}-${decision_fingerprint}-${identity_digest}"
          cp ruleset/dist/candidate_manifest.json .candidate/candidate-manifest.json
          cp ruleset/dist/candidate_sources.json .candidate/candidate-sources.json
          cp ruleset/dist/fetch_report.json .candidate/fetch-report.json
          cp ruleset/dist/source_health.json .candidate/source-health.json
          cp ruleset/dist/source_radar_decision.json \
            .candidate/source-radar-decision.json
          cp ruleset/dist/automated_review.json .candidate/automated-review.json
          tar -czf .candidate/ruleset-dist.tar.gz -C ruleset dist
          (
            cd .candidate
            sha256sum ruleset-dist.tar.gz > ruleset-dist.sha256
          )
          printf '%s\n' "$semantic_digest" > .candidate/semantic-digest.txt
          printf '%s\n' "$identity_digest" > .candidate/identity-digest.txt
          if [ -n "${OBSERVATION_ID:-}" ]; then
            printf '%s:%s\n' "$OBSERVATION_ID" "$OBSERVATION_ATTEMPT" \
              > .candidate/observation-id.txt
          else
            printf 'none:0\n' > .candidate/observation-id.txt
          fi
          {
            echo
            echo "- Decision fingerprint: \`${decision_fingerprint}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Verify remote README before candidate attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${{ github.repository }}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${{ github.repository }}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"

      - name: Attest candidate archive in the producing workflow
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: .candidate/ruleset-dist.tar.gz

      - name: Recheck README after candidate attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${{ github.repository }}/contents/README.md?ref=main" --jq '.size')" = "0"
          test "$(gh api "repos/${{ github.repository }}/contents/README.md?ref=main" --jq '.sha')" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"

      - name: Upload candidate and health evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: .candidate/

      - name: Recheck README privacy boundary
        run: |
          set -euo pipefail
          test -f README.md
          test ! -s README.md
          test "$(git hash-object README.md)" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
