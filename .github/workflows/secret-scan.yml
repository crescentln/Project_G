name: Secret Scan

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run gitleaks against the current tree
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$report_dir"
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v "$report_dir:/reports" \
            ghcr.io/gitleaks/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 \
            detect \
            --source /repo \
            --no-git \
            --config /repo/.gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path /reports/gitleaks.sarif
          cp "$report_dir/gitleaks.sarif" gitleaks.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          sarif_file: gitleaks.sarif
